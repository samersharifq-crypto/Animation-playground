<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Stranger at the Window</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=Permanent+Marker&family=Abril+Fatface&family=Playfair+Display:ital,wght@1,900&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root { --bg: #101414; --ink: #efe9df; --line: rgba(239,233,223,.22); --accent: #d9a21b; --btn: #1d2323; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #stage { position: relative; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.55); max-width: 100%; }
  #art { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 10px; font: 500 13px/1 system-ui, sans-serif; max-width: 100%; }
  #controls button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--btn); color: var(--ink); font-size: 15px; cursor: pointer; display: grid; place-items: center; flex: none; }
  #controls button:hover { border-color: rgba(239,233,223,.55); }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #bar { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 2px; background: var(--line); }
  #fill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; border-radius: 2px; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 74px; text-align: right; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 15px system-ui, sans-serif; color: rgba(239,233,223,.6); }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="art" width="1080" height="1920" role="img" aria-label="The Stranger at the Window: a cut-paper collage thriller about a man reading in a café, a stranger watching through the glass, a chase, and an arrest"></canvas>
    <div id="loading">loading…</div>
  </div>
  <div id="controls">
    <button id="pp" aria-label="Pause" title="Pause / Play (Space)">❚❚</button>
    <button id="rp" aria-label="Replay" title="Replay">↺</button>
    <button id="snd" aria-label="Sound" aria-pressed="false" title="Sound (M)">♪</button>
    <div id="bar" aria-label="Timeline"><div id="fill"></div></div>
    <div id="time">0:00 / 1:06</div>
  </div>
</main>
<audio id="music" src="soundtrack.m4a" preload="auto"></audio>
<script>
"use strict";
/* =====================================================================
   THE STRANGER AT THE WINDOW — a cut-paper collage thriller
   Grid paper, a mustard sun, torn cardboard and kraft, torn watercolour
   strips, halftone cut-outs with white scissor borders, ransom-note type,
   and stop-motion timing: characters move on twelves, the camera glides.
   Every frame is a pure function of time.
   ===================================================================== */
const W = 1080, H = 1920;
const art = document.getElementById('art');
const ctx = art.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const BA = mk(), BB = mk(), BL = mk();

const step12 = t => Math.floor(t * 12 + 1e-6);

function reset(g) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0; g.shadowColor = 'transparent'; g.shadowOffsetX = 0; g.shadowOffsetY = 0; g.filter = 'none'; }

const pop = (lt, a, d = .35) => easeBack((q12(lt) - a) / d);

/* ---------------- palette & fonts ---------------- */
const C = {
  grid: '#ecebe5', gridLine: 'rgba(120,130,140,.28)', mustard: '#d9a21b', teal: '#6e9ea5', tealD: '#3f6f76', ink: '#1d1b1a',
  red: '#c8322b', redD: '#8f211c', navy: '#2b3d6b', navyD: '#1b2747', kraft: '#b8946a', card: '#bdb6aa', cream: '#f4eee2',
  white: '#f7f3ea', coat: '#c9a46c', coatD: '#9e7b47', skin: '#e9b896', skinD: '#c98d6d', heroSkin: '#9a6a4c', orange: '#e0703a',
  lav: '#9d93c4', grass: '#2f9b82',

const F = { anton: '"Anton", Impact, sans-serif', type: '"Special Elite", "Courier New", monospace', marker: '"Permanent Marker", "Comic Sans MS", cursive', abril: '"Abril Fatface", Georgia, serif', play: '"Playfair Display", Georgia, serif', bungee: '"Bungee", Impact, sans-serif' };

/* ---------------- textures ---------------- */
const TX = {}, PAT = {};
function noiseCanvas(w, h, seed, fn) {
  const c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(w, h), d = id.data, R = mulberry32(seed);

}
function fibers(g, w, h, n, seed, col, len = 14) {

}
function paperTex(w, h, base, seed, o = {}) {

}
function buildTextures() {

  gg.strokeStyle = C.gridLine; gg.lineWidth = 1.4;
  for (let x = 6; x < W; x += 36) { gg.beginPath(); gg.moveTo(x + .5, 0); gg.lineTo(x + .5, H); gg.stroke(); }
  for (let y = 10; y < H; y += 36) { gg.beginPath(); gg.moveTo(0, y + .5); gg.lineTo(W, y + .5); gg.stroke(); }
  TX.grid = gp;

  TX.kraftL = paperTex(512, 512, '#c9a882', 23, { specks: 600, fib: 200, fibC: 'rgba(90,60,30,.5)' });

  const cd = paperTex(512, 512, C.card, 31, { specks: 500 }), cg = cd.getContext('2d');
  for (let y = 0; y < 512; y += 32) { const gr = cg.createLinearGradient(0, y, 0, y + 32); gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(.25, 'rgba(255,255,255,.05)'); gr.addColorStop(.7, 'rgba(60,50,40,.12)'); gr.addColorStop(1, 'rgba(255,255,255,.2)'); cg.fillStyle = gr; cg.fillRect(0, y, 512, 32); }

  TX.cream = paperTex(512, 512, C.cream, 43, { fib: 160, fibC: 'rgba(170,150,120,.5)' });

  ng.fillStyle = 'rgba(40,40,40,.55)';
  for (let col = 0; col < 5; col++) for (let y = 6; y < 512; y += 9) { if (NR() < .06) { y += 14; continue; } ng.fillRect(col * 102 + 6, y, 86 - NR() * (NR() < .15 ? 50 : 6), 3.2); }
  TX.news = np;
  // stair stripes card (darker)
  TX.cardD = paperTex(512, 512, '#8f8577', 61, { specks: 300 });

  const dt = mk(9, 9), dg = dt.getContext('2d'); dg.fillStyle = '#000'; dg.beginPath(); dg.arc(4.5, 4.5, 2.1, 0, TAU); dg.fill();
  TX.dot = dt;
  const dt2 = mk(14, 14), dg2 = dt2.getContext('2d'); dg2.fillStyle = '#000'; dg2.beginPath(); dg2.arc(7, 7, 3.6, 0, TAU); dg2.fill(); TX.dotBig = dt2;
  TX.grain = noiseCanvas(540, 960, 71, (r) => { const v = (r() * 255) | 0; return [v, v, v, 255]; });

  TX.wash = {};
  const washes = { orange: ['#f0a066', '#e0703a'], lav: ['#a9a1d0', '#7f74b5'], pink: ['#e9a0a0', '#d2706e'], blue: ['#8fc0d6', '#5d93b5'], peach: ['#f6c48d', '#eaa060'], grey: ['#9aa3b0', '#6b7585'], navy: ['#4b5b8f', '#2d3966'], green: ['#7d9a58', '#4f6b3a'], slate: ['#b9c0c9', '#8c95a3'], teal: ['#7fb0b2', '#3f7f86'], terra: ['#d38a5c', '#a95a36'] };

  gc.fillStyle = '#1f6f68'; gc.fillRect(0, 0, 512, 256);
  for (let i = 0; i < 2600; i++) { const x = GR() * 512, y = GR() * 256, l = 10 + GR() * 34; gc.strokeStyle = ['#2f9b82', '#3fb59a', '#185a5a', '#5cc7a8', '#2a4f7a'][(GR() * 5) | 0]; gc.globalAlpha = .5 + GR() * .5; gc.lineWidth = 1 + GR() * 2.4; gc.beginPath(); gc.moveTo(x, y); gc.lineTo(x + (GR() - .5) * 8, y - l); gc.stroke(); }

function washTex(c1, c2, seed) {

  g.fillStyle = c1; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) { const x = R() * w, y = R() * h, r = 20 + R() * 110, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c2 + '88'); gr.addColorStop(.6, c2 + '33'); gr.addColorStop(1, c2 + '00'); g.fillStyle = gr; g.fillRect(0, 0, w, h); }

const patCache = new Map();

/* ---------------- torn paper ---------------- */
// subdivide polygon edges with jagged noise; returns points

function limb(g, x1, y1, x2, y2, w, col, o = {}) {

/* ---------------- type ---------------- */

// ransom-note word: each letter on its own scrap

  else if (force || Math.abs(music.currentTime - T) > .25) music.currentTime = T;
}
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (ready && !CAPTURE) {
    if (playing && !ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; setPlaying(false); } }
    renderFrame(Math.min(T, TOTAL - .001));
    syncAudio(false);
    fill.style.width = (Math.min(T, TOTAL) / TOTAL * 100) + '%'; timeEl.textContent = `${fmt(Math.min(T, TOTAL))} / ${fmt(TOTAL)}`;
  }
  requestAnimationFrame(tick);
}
function replay() { T = 0; ended = false; setPlaying(true); }
pp.addEventListener('click', () => { if (ended) { replay(); return; } setPlaying(!playing); });
rp.addEventListener('click', replay);
snd.addEventListener('click', () => { sound = !sound; snd.setAttribute('aria-pressed', String(sound)); syncAudio(true); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.click(); } if (e.key === 'm' || e.key === 'M') snd.click(); });
function seek(x) { const r = bar.getBoundingClientRect(); T = clamp((x - r.left) / r.width) * TOTAL; ended = T >= TOTAL; syncAudio(true); }
bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); seek(e.clientX); });
bar.addEventListener('pointermove', e => { if (e.buttons) seek(e.clientX); });
window.__frame = (t, type = 'image/jpeg') => { renderFrame(t); return art.toDataURL(type, .92); };
window.__TOTAL = TOTAL;

buildTextures();
const fontLoads = ['40px "Anton"', '40px "Special Elite"', '40px "Permanent Marker"', '40px "Abril Fatface"', 'italic 900 40px "Playfair Display"', '40px "Bungee"'].map(f => document.fonts.load(f, 'THE STRANGER café 07'));
Promise.all([
  Promise.race([Promise.all(fontLoads).catch(() => {}), new Promise(r => setTimeout(r, 5000))]),
  loadImg('hero'),
]).then(() => {
  buildCollage(); patCache.clear();
  buildHero();
  ready = true; document.getElementById('loading').remove(); window.__ready = true;
  if (q.has('t')) T = +q.get('t');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!CAPTURE) { if (still && !q.has('t')) T = 66; setPlaying(!still); }
});
requestAnimationFrame(tick);
</script>
