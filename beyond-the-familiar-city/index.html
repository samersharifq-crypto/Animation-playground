<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ما وراء المألوف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #141317; --ink: #f4eee3; --line: rgba(244,238,227,.22); --accent: #f3c46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; }
  #stage { position: relative; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  #art { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 10px; direction: ltr; font: 500 13px/1 system-ui, sans-serif; }
  #controls button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #24212a; color: var(--ink); font-size: 15px; cursor: pointer; display: grid; place-items: center; flex: none; }
  #controls button:hover { border-color: rgba(244,238,227,.55); }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #bar { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 2px; background: var(--line); }
  #fill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; border-radius: 2px; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 74px; text-align: right; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 15px system-ui, sans-serif; color: rgba(244,238,227,.6); }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="art" width="1080" height="1920" role="img" aria-label="ما وراء المألوف — فيلم رسوم متحركة قصير"></canvas>
    <div id="loading">…</div>
  </div>
  <div id="controls">
    <button id="pp" aria-label="إيقاف مؤقت" title="Pause / Play (Space)">❚❚</button>
    <button id="rp" aria-label="إعادة التشغيل" title="Replay">↺</button>
    <button id="snd" aria-label="الصوت" aria-pressed="false" title="Sound (M)">♪</button>
    <div id="bar" aria-label="Timeline"><div id="fill"></div></div>
    <div id="time">0:00 / 1:05</div>
  </div>
</main>
<audio id="amb" src="beyond-the-familiar-city-sound.m4a" preload="auto"></audio>
<audio id="vo" src="narration.mp3" preload="auto"></audio>
<script>
"use strict";
/* =====================================================================
   ما وراء المألوف — Beyond the Familiar (city)
   A 60-second vertical short + title. Flat geometric city, elongated
   backlit figure, a print pass that limits everything to the palette and
   stipples the light. Every frame is a pure function of time.
   ===================================================================== */
const W = 1080, H = 1920;
const art = document.getElementById('art');
const MAIN = art.getContext('2d');
const SRC = document.createElement('canvas'); SRC.width = W; SRC.height = H;
const SRCX = SRC.getContext('2d');
let ctx = MAIN;

/* ---------------- palette ---------------- */
const C = {
  ink: '#1c1b20', char: '#2a2830', char2: '#3a3741', char3: '#524d58',
  teal: '#2d5a63', teal2: '#477d86', teal3: '#76a3a4', teal4: '#a8c6c1',
  rose: '#a87773', rose2: '#c49890', rose3: '#dfbdb3',
  terra: '#a9543f', terra2: '#c66f53', terra3: '#dd9473',
  ivory: '#f4eee3', ivory2: '#ddd3c2', sun: '#f3c46a', sun2: '#ffe0a0',
  skin: '#c48b6d', skinS: '#7b5045', hair: '#19171b',
  coat: '#35303c', coatD: '#26232b', trou: '#2a2730', shoe: '#141216', wood: '#6b4334', wood2: '#87573f',
};
const INKS = [C.ink, C.char, C.char2, C.char3, C.teal, C.teal2, C.teal3, C.teal4, C.rose, C.rose2, C.rose3, C.terra, C.terra2, C.terra3,
  C.ivory, C.ivory2, C.sun, C.sun2, C.skin, C.skinS, C.coat, C.coatD, C.wood, C.wood2, '#1f3d44', '#7d6f78', '#e9d9c4'];

/* ---------------- helpers ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const mod = (a, n) => ((a % n) + n) % n;
function canvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function radial(x, y, r, hex, a, c = ctx) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(hex, a)); g.addColorStop(1, rgba(hex, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
function lin(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function poly(pts, c = ctx) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function P(pts) { const p = new Path2D(); p.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]); p.closePath(); return p; }
function cam(pwx, pwy, psx, psy, s) { ctx.translate(psx, psy); ctx.scale(s, s); ctx.translate(-pwx, -pwy); }
function rim(path, base, lit, dx, dy = 0) { ctx.fillStyle = lit; ctx.fill(path); ctx.save(); ctx.clip(path); ctx.translate(-dx, dy); ctx.fillStyle = base; ctx.fill(path); ctx.restore(); }
function vignette(a) { const g = ctx.createRadialGradient(W / 2, H * .46, H * .28, W / 2, H * .5, H * .78); g.addColorStop(0, rgba(C.ink, 0)); g.addColorStop(1, rgba(C.ink, a)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function shade(x0, y0, x1, y1, hex, a) { ctx.fillStyle = lin(ctx, x0, y0, x1, y1, [[0, rgba(hex, 0)], [1, rgba(hex, a)]]); ctx.fillRect(0, 0, W, H); }
function drawLeaf(x, y, len, rot, fill, vein = null, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sy); ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(-len / 2, 0);
  ctx.bezierCurveTo(-len * .2, -len * .34, len * .25, -len * .28, len / 2, 0); ctx.bezierCurveTo(len * .25, len * .28, -len * .2, len * .34, -len / 2, 0); ctx.fill();
  if (vein) { ctx.strokeStyle = vein; ctx.lineWidth = Math.max(1, len * .03); ctx.beginPath(); ctx.moveTo(-len * .62, 0); ctx.lineTo(len * .42, 0); ctx.stroke(); }
  ctx.restore();
}
function steam(x, y, h, t, a = 1, w = 1) {
  ctx.save(); ctx.lineCap = 'round';
  for (const [o, wt] of [[0, 1], [1.9, .6], [3.4, .45]]) {
    const p = new Path2D();
    for (let i = 0; i <= 40; i++) { const q = i / 40, yy = y - q * h;
      const xx = x + (Math.sin(q * 4.0 - t * .9 + o) * .62 + Math.sin(q * 7.3 - t * 1.4 + o * 2) * .22) * q * 60 * w + Math.sin(t * .3 + o) * q * 26 * w + (o - 1.8) * 5 * w * q;
      i ? p.lineTo(xx, yy) : p.moveTo(xx, yy); }
    ctx.strokeStyle = lin(ctx, 0, y, 0, y - h, [[0, rgba(C.ivory, 0)], [.12, rgba(C.ivory, .7 * a * wt)], [.6, rgba(C.ivory, .3 * a * wt)], [1, rgba(C.ivory, 0)]]);
    ctx.lineWidth = 16 * w; ctx.globalAlpha = .35; ctx.stroke(p); ctx.lineWidth = 6 * w; ctx.globalAlpha = 1; ctx.stroke(p);
  }
  ctx.restore();
}
function dust(x0, y0, x1, y1, t, n, seed, a = .8) {
  for (let i = 0; i < n; i++) { const r = mulberry32(seed + i), u = mod(r() + t * (.01 + r() * .015), 1);
    ctx.fillStyle = rgba(C.sun2, a * Math.sin(u * Math.PI)); ctx.beginPath();
    ctx.arc(lerp(x0, x1, r()) + Math.sin(t * .7 + i) * 14, lerp(y1, y0, u), 2 + r() * 2.5, 0, 7); ctx.fill(); }
}

/* =====================================================================
   THE MAN — elongated, dark coat, minimal face, rim of cool light
   ===================================================================== */
const MAN = { coat: C.coat, coatD: C.coatD, lit: C.teal2, trou: C.trou, shoe: C.shoe, skin: C.skin, skinS: C.skinS, hair: C.hair };
const HEAD = P([-26, -44, -36, -70, -34, -100, -20, -122, 4, -130, 24, -124, 34, -108, 36, -92, 45, -80, 36, -74, 35, -64, 30, -52, 14, -44]);
const HAIRP = P([-30, -60, -40, -92, -30, -122, -4, -137, 24, -131, 39, -112, 30, -111, 10, -117, -6, -110, -14, -90, -18, -64]);
function headSide(o, pal, L) {             // origin: neck base, facing +x
  ctx.save(); ctx.rotate(-(o.look || 0) * .28);
  ctx.fillStyle = pal.skinS; ctx.fillRect(-9, -46, 20, 50);
  rim(HEAD, pal.skinS, pal.skin, 9 * L, 3);
  ctx.fillStyle = pal.hair; ctx.fill(HAIRP);
  if (!o.sil) {
    ctx.fillStyle = pal.skinS; ctx.beginPath(); ctx.ellipse(-6, -82, 6, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C.ink;
    if (o.blink) ctx.fillRect(18, -93, 10, 2.5); else { ctx.beginPath(); ctx.ellipse(23 + (o.gaze || 0) * 3, -92, 3.2, 4.2, 0, 0, 7); ctx.fill(); }
    ctx.fillRect(15, -104, 16, 3);
  }
  ctx.restore();
}
function cupShape(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  rim(P([-18, -40, 18, -40, 14, 16, -14, 16]), C.ivory2, C.ivory, 8);
  ctx.fillStyle = C.terra2; poly([-17, -20, 17, -20, 15, 0, -15, 0]); ctx.fill();
  ctx.fillStyle = C.char; poly([-21, -48, 21, -48, 19, -40, -19, -40]); ctx.fill();
  ctx.restore();
}
// profile; origin = feet; height ~760 at s=1
function walkSide(x, y, s, o = {}) {
  const pal = o.pal || MAN, ph = o.phase || 0, wk = o.walk ?? 0, L = (o.flip ? -1 : 1) * (o.light ?? 1);
  const br = Math.sin((o.t || 0) * 1.6) * 3 * (o.breathe ?? 1), tense = (o.tense || 0) * 10;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.translate(x, y); ctx.scale(o.flip ? -s * (o.sx ?? 1) : s * (o.sx ?? 1), s);
  const A = .4 * wk, a1 = Math.sin(ph) * A, a2 = -a1;
  ctx.translate(0, 380 * (1 - Math.cos(Math.abs(a1))) * .85);
  const leg = (p, a, dark) => {
    const kx = Math.sin(a) * 190, ky = -380 + Math.cos(a) * 190, bend = Math.max(0, Math.cos(p)) * 1.0 * wk + .04, sa = a - bend;
    const fx = kx + Math.sin(sa) * 192, fy = ky + Math.cos(sa) * 192;
    ctx.strokeStyle = dark ? pal.coatD : pal.trou; ctx.lineWidth = 36; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, -380); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.save(); ctx.translate(fx, fy); ctx.rotate(clamp(sa * .7, -.5, .5)); ctx.fillStyle = pal.shoe; ctx.beginPath(); ctx.ellipse(18, -2, 34, 12, 0, 0, 7); ctx.fill(); ctx.restore();
  };
  const sleeve = (pts, dark) => {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 40;
    const path = () => { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); };
    if (dark) { ctx.strokeStyle = pal.coatD; path(); ctx.stroke(); }
    else { ctx.strokeStyle = pal.lit; path(); ctx.stroke(); ctx.save(); ctx.translate(-11 * L, 4); ctx.strokeStyle = pal.coat; path(); ctx.stroke(); ctx.restore(); }
    const hx = pts[pts.length - 2], hy = pts[pts.length - 1];
    ctx.fillStyle = dark ? pal.skinS : pal.skin; ctx.beginPath(); ctx.ellipse(hx + 4, hy + 10, 13, 17, 0, 0, 7); ctx.fill();
  };
  const armPts = ang => { const ex = Math.sin(ang) * 150, ey = -630 + tense - br + Math.cos(ang) * 150; return [6, -630 + tense - br, ex, ey, ex + Math.sin(ang + .3) * 140, ey + Math.cos(ang + .3) * 140]; };
  leg(ph + Math.PI, a2, true);
  sleeve(armPts(a1 * .8), true);
  leg(ph, a1, false);
  const sw = Math.sin(ph) * wk;
  const coat = new Path2D(); coat.moveTo(-34, -648 + tense - br); coat.quadraticCurveTo(-58, -600, -56, -520); coat.lineTo(-66 - sw * 8, -292);
  coat.quadraticCurveTo(0, -280, 64 + sw * 10, -296); coat.lineTo(52, -520); coat.quadraticCurveTo(54 + br * .4, -610, 30, -648 + tense - br); coat.quadraticCurveTo(0, -660, -34, -648 + tense - br); coat.closePath();
  rim(coat, pal.coat, pal.lit, 22 * L, 4);
  if (!o.sil) { ctx.strokeStyle = rgba(C.ink, .5); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(38, -600); ctx.lineTo(44, -300); ctx.stroke();
    ctx.fillStyle = C.ivory2; poly([16, -650 + tense - br, 32, -646 + tense - br, 26, -612]); ctx.fill(); }
  ctx.save(); ctx.translate(8, -650 + tense - br); ctx.scale(.7, .7); headSide(o, pal, L); ctx.restore();
  if (o.cup) {
    const f = o.finger || 0, hx = 66, hy = -548 + f * 4;
    sleeve([6, -630 + tense - br, 22, -488, hx - 6, hy], false);
    cupShape(hx + 12, hy - 6, 1);
    ctx.fillStyle = pal.skin; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(hx + 22, hy - 22 + i * 12 + f * (i - 1) * 2, 8, 5, 0, 0, 7); ctx.fill(); }
  } else sleeve(armPts(a2 * .8), false);
  ctx.restore();
}
// from behind; origin = feet
function walkBack(x, y, s, o = {}) {
  const pal = o.pal || MAN, ph = o.phase || 0, wk = o.walk ?? 0, look = o.look || 0, L = o.light ?? 1, tense = (o.tense || 0) * 12, turn = o.turn || 0;
  const br = Math.sin((o.t || 0) * 1.6) * 2.5;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.translate(x, y); ctx.scale(s * (o.sx ?? 1), s);
  for (const side of [-1, 1]) { const lift = Math.max(0, side * Math.sin(ph)) * 46 * wk;
    ctx.fillStyle = side === L ? pal.trou : pal.coatD; ctx.fillRect(side * 26 - 18, -380, 36, 380 - lift);
    ctx.fillStyle = pal.shoe; ctx.beginPath(); ctx.ellipse(side * 26, -8 - lift, 22, 12, 0, 0, 7); ctx.fill(); }
  ctx.translate(Math.sin(ph) * 5 * wk, -Math.abs(Math.cos(ph)) * 6 * wk);
  for (const side of [-1, 1]) { const swing = Math.cos(ph) * side * 16 * wk;
    ctx.fillStyle = side === L ? pal.lit : pal.coatD;
    poly([side * 58, -628 + tense - br, side * 80, -560, side * 82 + swing * .3, -420 + swing, side * 58 + swing * .3, -420 + swing, side * 54, -600]); ctx.fill();
    ctx.fillStyle = side === L ? pal.skin : pal.skinS; ctx.beginPath(); ctx.ellipse(side * 72 + swing * .3, -404 + swing, 13, 17, 0, 0, 7); ctx.fill(); }
  const coat = P([-62, -640 + tense - br, -66, -520, -76, -292, -40, -284, 0, -282, 40, -284, 76, -292, 66, -520, 62, -640 + tense - br, 30, -654 + tense - br, -30, -654 + tense - br]);
  rim(coat, pal.coat, pal.lit, 26 * L, 4);
  if (!o.sil) { ctx.strokeStyle = rgba(C.ink, .55); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -430); ctx.lineTo(0, -284); ctx.moveTo(-62, -470); ctx.lineTo(62, -470); ctx.stroke(); }
  ctx.fillStyle = pal.skinS; ctx.fillRect(-12, -686 + tense, 24, 40); ctx.fillStyle = pal.coatD; poly([-34, -654 + tense - br, 34, -654 + tense - br, 22, -676 + tense, -22, -676 + tense]); ctx.fill();
  const hy = -716 - look * 8 + tense * .6, tx = turn * 9;
  ctx.fillStyle = pal.skinS; ctx.beginPath(); ctx.ellipse(-31 + tx * .5, hy + 6, 6, 11, 0, 0, 7); ctx.fill(); ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.ellipse(31 + tx * .5, hy + 6, 6, 11, 0, 0, 7); ctx.fill();
  if (Math.abs(turn) > .3) { ctx.fillStyle = turn > 0 ? pal.skin : pal.skinS; ctx.beginPath(); ctx.ellipse(turn * 34, hy + 10, 9, 14, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = pal.hair; ctx.beginPath(); ctx.ellipse(tx * .3, hy - look * 4, 32, 40 - look * 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(L > 0 ? C.teal2 : C.teal, .9); ctx.beginPath(); ctx.ellipse(L * 22 + tx * .3, hy - 10 - look * 4, 7, 22, .15 * L, 0, 7); ctx.fill();
  ctx.restore();
}
// turning from profile to back: squash one into the other
function turning(x, y, s, u, side, back) {
  if (u < .5) walkSide(x, y, s, Object.assign({}, side, { sx: 1 - u * 2 }));
  else walkBack(x, y, s, Object.assign({}, back, { sx: u * 2 - 1 }));
}
const CROWD = [C.char2, C.char3, '#1f3d44', C.char, '#4a3e48'];
function passer(x, y, s, t, k, dir, extra = {}) {
  const col = CROWD[k % CROWD.length];
  walkSide(x, y, s, Object.assign({ pal: { coat: col, coatD: C.ink, lit: k % 2 ? C.teal2 : C.rose, trou: C.ink, shoe: C.ink, skin: col, skinS: col, hair: C.ink }, sil: true, flip: dir < 0, phase: t * 7 + k * 1.7, walk: 1, t }, extra));
}

/* =====================================================================
   SCENE 1 — A MORNING HE BARELY NOTICES (café window)
   ===================================================================== */
const CAFE = (() => {
  const c = canvas(), g = c.getContext('2d'), prev = ctx; ctx = g; const r = mulberry32(3);
  g.fillStyle = C.teal; g.fillRect(0, 0, W, 130); g.fillStyle = C.teal2; for (const y of [22, 46, 70]) g.fillRect(0, y, W, 6);
  g.fillStyle = C.rose; g.fillRect(0, 130, W, 520);
  g.fillStyle = lin(g, 0, 130, 0, 650, [[0, rgba(C.char, .35)], [.5, rgba(C.char, 0)]]); g.fillRect(0, 130, W, 520);
  for (let i = 0; i < 4; i++) { const x = 90 + i * 240; g.fillStyle = C.ivory2; g.fillRect(x, 440, 170, 180); g.fillStyle = i === 2 ? C.sun : C.teal; g.fillRect(x + 12, 452, 146, 168); g.fillStyle = C.ivory2; g.fillRect(x + 82, 452, 6, 168); }
  g.fillStyle = C.ivory; g.fillRect(0, 640, W, 40); g.fillStyle = C.ivory2; g.fillRect(0, 676, W, 6);
  g.fillStyle = C.terra; g.fillRect(40, 690, 1000, 60); g.fillStyle = C.terra2; for (let x = 40; x < 1040; x += 50) { g.beginPath(); g.arc(x + 25, 750, 25, 0, Math.PI); g.fill(); }
  g.fillStyle = C.char; g.fillRect(60, 790, 960, 740);
  // warm interior
  g.save(); g.beginPath(); g.rect(90, 820, 900, 620); g.clip();
  g.fillStyle = lin(g, 0, 820, 0, 1440, [[0, C.terra2], [.55, C.rose2], [1, C.terra]]); g.fillRect(90, 820, 900, 620);
  for (const lx of [250, 540, 830]) { g.strokeStyle = C.char; g.lineWidth = 3; g.beginPath(); g.moveTo(lx, 820); g.lineTo(lx, 930); g.stroke(); g.fillStyle = C.char; poly([lx - 34, 960, lx + 34, 960, lx + 16, 930, lx - 16, 930], g); g.fill(); radial(lx, 975, 170, C.sun2, .75, g); g.fillStyle = C.sun2; g.fillRect(lx - 20, 958, 40, 8); }
  g.fillStyle = C.wood; g.fillRect(90, 1260, 900, 180); g.fillStyle = C.wood2; g.fillRect(90, 1260, 900, 16);
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 3 ? C.ivory : C.teal4; g.fillRect(120 + i * 52, 1210 - (i % 2) * 6, 26, 40 + (i % 2) * 6); }
  g.fillStyle = C.wood; for (const y of [1060, 1140]) g.fillRect(560, y, 400, 10);
  for (let i = 0; i < 10; i++) { g.fillStyle = [C.ivory, C.teal3, C.rose3][i % 3]; g.fillRect(580 + i * 36, (i % 2 ? 1140 : 1060) - 34, 22, 34); }
  g.restore();
  g.fillStyle = C.char; g.fillRect(380, 820, 14, 620); g.fillRect(690, 820, 14, 620); g.fillRect(90, 1120, 900, 10);
  g.fillStyle = C.terra; g.fillRect(60, 1440, 960, 90);
  g.fillStyle = C.char2; g.fillRect(0, 1530, W, 390);
  g.strokeStyle = rgba(C.teal, .7); g.lineWidth = 3; for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(0, 1560 + i * 70 + i * i * 6); g.lineTo(W, 1560 + i * 70 + i * i * 6); g.stroke(); }

  float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p, p.yx+19.19); return fract((p.x+p.y)*p.x); }
  void main(){ vec3 c = texture(src, uv).rgb; float d1 = 1e9, d2 = 1e9; vec3 a = c, b = c;
    for (int i = 0; i < ${INKS.length}; i++) { vec3 e = c - pal[i]; float d = dot(e, e * vec3(.9,1.2,.7)); if (d < d1) { d2 = d1; b = a; d1 = d; a = pal[i]; } else if (d < d2) { d2 = d; b = pal[i]; } }
    float t = sqrt(d1) / (sqrt(d1) + sqrt(d2) + 1e-5); float n = hash(floor(gl_FragCoord.xy / 1.6) + seed); o = vec4(n < t ? b : a, 1.); }`;
  const mk = (ty, s) => { const sh = gl.createShader(ty); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  let prog; try { prog = gl.createProgram(); gl.attachShader(prog, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, fs)); gl.bindAttribLocation(prog, 0, 'p'); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog)); } catch (e) { console.warn('print pass disabled', e); return null; }
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform3fv(gl.getUniformLocation(prog, 'pal'), new Float32Array(INKS.flatMap(h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; })));
  const uSeed = gl.getUniformLocation(prog, 'seed'), tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  return { canvas: c, render(source, T) { gl.viewport(0, 0, W, H); gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source); gl.uniform1f(uSeed, (Math.floor(T * 8) % 4) * 7.13); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); } };
})();

/* ---------------- sound cues (footsteps, cars, pages) for the soundtrack builder ---------------- */
function manAt(T) {
  const i = sceneAt(T), t = T - SC[i].start;
  if (i === 1) { const sc = s2sc(t); return { ph: sc / 62, wk: t < 6 ? 1 : t < 9 ? 1 - (t - 6) / 3 : 0 }; }
  if (i === 2) { const m = s3man(t); return m.mode === 'turn' ? { ph: 0, wk: 0 } : { ph: m.ph, wk: m.wk }; }
  if (i === 3) { const m = s4man(t); return { ph: m.ph, wk: m.wk }; }
  if (i === 5 && t > 4.2 && t < 10.6) { const m = s6man(t); return { ph: m.ph, wk: 1, far: (t - 4.2) / 6.4 }; }
  return { ph: 0, wk: 0 };
}
window.__events = () => {
  const ev = []; let last = null;
  for (let T = 0; T < TOTAL; T += 1 / 240) { const m = manAt(T); const k = Math.floor(m.ph / Math.PI);
    if (last && m.wk > .2 && k !== last.k && sceneAt(T) === last.i) ev.push({ t: +T.toFixed(3), type: 'step', g: m.wk * (m.far !== undefined ? 1 - m.far * .7 : 1), scene: sceneAt(T) });
    last = { k, i: sceneAt(T) }; }
  for (const c of S2_CARS) for (let t = 0; t < 10; t += 1 / 120) { const a = carX(c, t, s2sc(t)) + c.w / 2, b = carX(c, t + 1 / 120, s2sc(t + 1 / 120)) + c.w / 2; if ((a - 540) * (b - 540) <= 0) ev.push({ t: +(10 + t).toFixed(3), type: 'car', dir: c.dir, near: c.y > 1750 ? 1 : .7 }); }
  ev.push({ t: 40.0, type: 'page' }, { t: 40.6, type: 'page' }, { t: 46.3, type: 'note' }, { t: 48.7, type: 'close' });
  return ev;
};

/* =====================================================================
   PLAYER
   ===================================================================== */
const stage = document.getElementById('stage'), controls = document.getElementById('controls');
const pp = document.getElementById('pp'), rp = document.getElementById('rp'), snd = document.getElementById('snd'), bar = document.getElementById('bar'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
const amb = document.getElementById('amb'), vo = document.getElementById('vo'); let voOK = false; vo.addEventListener('canplay', () => voOK = true); vo.addEventListener('error', () => voOK = false);
function layout() { const aw = innerWidth - 32, ah = innerHeight - 24 - 52, w = Math.max(160, Math.min(aw, ah * 9 / 16)); stage.style.width = w + 'px'; stage.style.height = (w * 16 / 9) + 'px'; controls.style.width = Math.max(w, Math.min(aw, 340)) + 'px'; }
addEventListener('resize', layout); layout();
const CAPTURE = new URLSearchParams(location.search).has('capture');
let T = 0, playing = false, ended = false, last = 0, ambient = 0, ready = false, sound = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function syncAudio(force) {
  for (const a of [amb, voOK ? vo : null]) { if (!a) continue;
    if (!sound || !playing || ended) { if (!a.paused) a.pause(); continue; }
    if (force || Math.abs(a.currentTime - T) > .25) { try { a.currentTime = T; } catch (e) {} }
    if (a.paused) a.play().catch(() => {}); }
}
function setPlaying(p) { playing = p; pp.textContent = p ? '❚❚' : '▶'; pp.setAttribute('aria-label', p ? 'إيقاف مؤقت' : 'تشغيل'); syncAudio(true); }
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (ready && !CAPTURE) {
    if (playing) { if (!ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; syncAudio(); } } else ambient += dt; }
    renderFrame(ended ? TOTAL - .001 + ambient : T); syncAudio(false);
    fill.style.width = (Math.min(T, TOTAL) / TOTAL * 100) + '%'; timeEl.textContent = `${fmt(Math.min(T, TOTAL))} / ${fmt(TOTAL)}`;
  }
  requestAnimationFrame(tick);
}
function replay() { T = 0; ended = false; ambient = 0; setPlaying(true); }
pp.addEventListener('click', () => { if (ended && !playing) { replay(); return; } setPlaying(!playing); });
rp.addEventListener('click', replay);
snd.addEventListener('click', () => { sound = !sound; snd.setAttribute('aria-pressed', String(sound)); syncAudio(true); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.click(); } if (e.key === 'm') snd.click(); });
function seek(x) { const r = bar.getBoundingClientRect(); T = clamp((x - r.left) / r.width) * TOTAL; ended = T >= TOTAL; ambient = 0; syncAudio(true); }
bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); seek(e.clientX); });
bar.addEventListener('pointermove', e => { if (e.buttons) seek(e.clientX); });
window.__frame = (t, type = 'image/jpeg') => { renderFrame(t); return art.toDataURL(type, .93); };
window.__TOTAL = TOTAL;
const q = new URLSearchParams(location.search);

Promise.race([Promise.all([document.fonts.load(`500 58px "Noto Naskh Arabic"`, 'ما وراء'), document.fonts.load(`400 58px FreeSerif`, 'ما')]).catch(() => {}), new Promise(r => setTimeout(r, 3500))]).then(() => {
  ready = true; document.getElementById('loading').remove(); window.__ready = true; if (q.has('t')) T = +q.get('t'); if (!q.has('capture')) setPlaying(true);
});
requestAnimationFrame(tick);
</script>
