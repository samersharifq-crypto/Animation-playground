<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainy Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4ead8; --dim: rgba(244,234,216,.55); }
  html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    width: min(720px, calc(100% - 32px)); display: flex; align-items: center; gap: 14px;
    font: 400 14px/1 "Cormorant Garamond", Georgia, serif; color: var(--ink);
    transition: opacity .6s ease; opacity: 1;
  }
  #ui.hide { opacity: 0; }
  #ui button {
    background: rgba(10,14,22,.55); color: var(--ink); border: 1px solid rgba(244,234,216,.25);
    border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 15px; letter-spacing: .06em;
    cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap;
  }
  #ui button:hover { border-color: rgba(244,234,216,.6); }
  #bar { position: relative; flex: 1; height: 18px; cursor: pointer; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 2px; background: rgba(244,234,216,.18); border-radius: 2px; }
  #fill { position: absolute; left: 0; top: 8px; height: 2px; width: 0; background: var(--ink); border-radius: 2px; }
  .tick { position: absolute; top: 5px; width: 1px; height: 8px; background: rgba(244,234,216,.4); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="play" aria-label="Pause">❚❚ pause</button>
  <div id="bar"><div id="fill"></div></div>
  <button id="snd" aria-label="Toggle rain sound">♪ sound off</button>
</div>
<script>
"use strict";
/* ============================================================
   RAINY DAY — a motion graphic in six scenes
   1. coffee by the window   2. walking the old street
   3. nostalgia              4. strangers running from the rain
   5. going home             6. inside, in bed
   ============================================================ */
const W = 1920, H = 1080, GROUND = 640;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let base = [1,0,0,1,0,0], dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  const s = Math.min(w / W, h / H);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ox = (w - W * s) / 2, oy = (h - H * s) / 2;
  base = [dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy];
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(20261105);
const rnd = (a, b) => a + (b - a) * Math.random();
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const mod = (a, n) => ((a % n) + n) % n;
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const k = f < 0 ? 0 : 255, a = Math.abs(f);
  r = Math.round(lerp(r, k, a)); g = Math.round(lerp(g, k, a)); b = Math.round(lerp(b, k, a));
  return `rgb(${r},${g},${b})`;
}
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace('A', a)); g.addColorStop(1, color.replace('A', 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function offscreen(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------- pre-rendered city strips ---------- */
function makeStrip(n, minW, maxW, minH, maxH, palette, near) {
  const bl = []; let x = 0;
  for (let i = 0; i < n; i++) { const w = lerp(minW, maxW, R()), h = lerp(minH, maxH, R()); bl.push({ x, w, h, s: R() }); x += w + (near ? R() * 10 : R() * 30 - 10); }
  const total = Math.ceil(x);
  const c = offscreen(total, GROUND), g = c.getContext('2d');
  const awnings = ['#5b2f35', '#2f4b4f', '#6a5530', '#3b3557'];
  for (const b of bl) {
    const top = GROUND - b.h;
    g.fillStyle = palette[Math.floor(b.s * palette.length)];
    g.fillRect(b.x, top, b.w, b.h);
    if (b.s > .55) { g.fillRect(b.x + b.w * .2, top - 26, b.w * .14, 26); }           // chimney
    if (near) {
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(b.x, top, b.w, 10);                  // cornice
      g.fillStyle = 'rgba(255,255,255,.03)'; g.fillRect(b.x, top, 3, b.h);
    }
    const ww = near ? 22 : 9, wh = near ? 30 : 12, gx = near ? 46 : 20, gy = near ? 58 : 26;
    const cols = Math.floor((b.w - 20) / gx), rows = Math.floor((b.h - (near ? 150 : 30)) / gy);
    const rr = mulberry32(Math.floor(b.s * 1e9));
    const ox = b.x + (b.w - cols * gx) / 2 + (gx - ww) / 2;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const lit = rr() < (near ? .32 : .22);
      const wx = ox + i * gx, wy = top + 26 + j * gy;
      if (lit) {
        const warm = rr() < .8;
        g.fillStyle = warm ? `rgba(246,${190 + rr() * 30 | 0},${110 + rr() * 30 | 0},${.55 + rr() * .4})` : `rgba(170,200,240,${.4 + rr() * .3})`;
        g.fillRect(wx, wy, ww, wh);
        if (near) { g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(wx + ww / 2 - 1, wy, 2, wh); }
      } else { g.fillStyle = near ? 'rgba(10,14,22,.65)' : 'rgba(10,14,22,.4)'; g.fillRect(wx, wy, ww, wh); }
    }
    if (near && b.w > 170) {                                                              // shop front
      const sw = b.w - 40, sx = b.x + 20, sy = GROUND - 120;
      const lg = g.createLinearGradient(0, sy, 0, GROUND);
      lg.addColorStop(0, 'rgba(250,200,130,.85)'); lg.addColorStop(1, 'rgba(200,120,60,.6)');
      g.fillStyle = lg; g.fillRect(sx, sy, sw, 110);
      g.fillStyle = 'rgba(40,24,14,.6)'; for (let k = 1; k < 4; k++) g.fillRect(sx + sw * k / 4 - 2, sy, 4, 110);
      const ac = awnings[Math.floor(rr() * awnings.length)];
      g.fillStyle = ac; g.beginPath(); g.moveTo(sx - 10, sy - 30); g.lineTo(sx + sw + 10, sy - 30); g.lineTo(sx + sw + 24, sy + 8); g.lineTo(sx - 24, sy + 8); g.fill();
      g.fillStyle = 'rgba(255,255,255,.08)'; for (let k = 0; k < sw + 40; k += 30) g.fillRect(sx - 20 + k, sy - 30, 14, 38);
    }
  }
  // reflection: blurred, flipped
  const rc = offscreen(total, GROUND), rg = rc.getContext('2d');
  rg.filter = 'blur(5px)'; rg.drawImage(c, 0, 0); rg.filter = 'none';
  return { c, rc, total };
}
const FAR = makeStrip(60, 70, 190, 160, 430, ['#1a2230', '#1d2535', '#182030'], false);
const NEAR = makeStrip(34, 150, 300, 260, 520, ['#232b3a', '#2a2a36', '#262f3d', '#2e2a33'], true);

function drawStrip(S, scroll, k) {
  const off = -mod(scroll * k, S.total);
  for (let x = off; x < W; x += S.total) ctx.drawImage(S.c, x, 0);
}
function drawStripReflection(S, scroll, k, a) {
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(0, GROUND * 1.65); ctx.scale(1, -.65);
  const off = -mod(scroll * k, S.total);
  for (let x = off; x < W; x += S.total) ctx.drawImage(S.rc, x, 0);
  ctx.restore();
}

/* grain */
const GRAIN = (() => { const c = offscreen(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return ctx.createPattern(c, 'repeat'); })();
function grain(a) {
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  ctx.translate(Math.random() * 256, Math.random() * 256); ctx.fillStyle = GRAIN; ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
}
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ---------- rain ---------- */
const drops = Array.from({ length: 900 }, () => ({ x: rnd(-200, W + 200), y: rnd(-H, H), z: Math.random() }));
const splashes = [];
let rainPaths = [];
function updateRain(dt, opts) {
  const { intensity = 1, wind = -80, landTop = GROUND + 20, splash = true } = opts;
  const n = Math.floor(drops.length * clamp(intensity / 1.4));
  rainPaths = [new Path2D(), new Path2D(), new Path2D()];
  for (let i = 0; i < n; i++) {
    const d = drops[i], sp = 1100 + 1300 * d.z;
    d.y += sp * dt; d.x += wind * (0.4 + d.z) * dt;
    const land = landTop + d.z * (H - landTop + 40);
    if (d.y > land) {
      if (splash && d.z > .25 && splashes.length < 260) splashes.push({ x: d.x, y: land, life: 0, z: d.z });
      d.y = rnd(-260, -20); d.x = rnd(-200, W + 200);
    }
    const len = 18 + 46 * d.z, b = d.z < .45 ? 0 : d.z < .8 ? 1 : 2;
    const dx = -wind * .02 * len / 30;
    rainPaths[b].moveTo(d.x, d.y); rainPaths[b].lineTo(d.x + dx, d.y - len);
  }
}
function drawRain(alpha = 1, tint = '200,215,235') {
  ctx.save(); ctx.lineCap = 'round';
  const ws = [1, 1.6, 2.4], as = [.18, .3, .42];
  for (let b = 0; b < 3; b++) { ctx.strokeStyle = `rgba(${tint},${as[b] * alpha})`; ctx.lineWidth = ws[b]; ctx.stroke(rainPaths[b]); }
  ctx.restore();
}
function drawSplashes(dt, alpha = 1) {
  ctx.save(); ctx.lineWidth = 1.4;
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.life += dt * 3.2;
    if (s.life >= 1) { splashes.splice(i, 1); continue; }
    const r = (4 + 14 * s.z) * s.life;
    ctx.strokeStyle = `rgba(210,225,245,${(1 - s.life) * .55 * alpha})`;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, r, r * .3, 0, 0, 7); ctx.stroke();
    if (s.life < .5) { ctx.fillStyle = `rgba(220,235,250,${(1 - s.life * 2) * .6 * alpha})`;
      for (let k = -1; k <= 1; k += 2) { ctx.beginPath(); ctx.arc(s.x + k * r * .8, s.y - 10 * s.z * Math.sin(s.life * Math.PI * 2), 1.3, 0, 7); ctx.fill(); } }
  }
  ctx.restore();
}
function lampRain(lamps) {                    // rain sparkles inside lamp cones
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const L of lamps) {
    ctx.save(); ctx.beginPath(); ctx.moveTo(L.x - 10, L.y); ctx.lineTo(L.x + 260, GROUND + 330); ctx.lineTo(L.x - 280, GROUND + 330); ctx.closePath(); ctx.clip();
    for (let b = 1; b < 3; b++) { ctx.strokeStyle = `rgba(255,214,150,${.35 * L.a})`; ctx.lineWidth = b * 1.2; ctx.stroke(rainPaths[b]); }
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- glass droplets ---------- */
function makeGlass(n, x0, y0, x1, y1) {
  return { x0, y0, x1, y1, d: Array.from({ length: n }, () => ({ x: rnd(x0, x1), y: rnd(y0, y1), r: Math.pow(Math.random(), 2) * 9 + 1.5, v: 0, trail: 0 })) };
}
function drawGlass(G, dt, a = 1) {
  ctx.save();
  for (const d of G.d) {
    if (d.v === 0 && d.r > 5 && Math.random() < dt * .25) d.v = rnd(60, 220);
    if (d.v > 0) { d.y += d.v * dt; d.x += Math.sin(d.y * .05) * .3; d.trail = Math.min(d.trail + d.v * dt, 160); d.v *= (1 - dt * .15); if (d.v < 15) { d.v = 0; } }
    else d.trail = Math.max(0, d.trail - dt * 40);
    if (d.y > G.y1 + 20) { d.y = rnd(G.y0 - 20, G.y0 + 60); d.x = rnd(G.x0, G.x1); d.v = 0; d.trail = 0; d.r = Math.pow(Math.random(), 2) * 9 + 1.5; }
    if (Math.random() < dt * .05) d.r = Math.min(d.r + .5, 10);
    if (d.trail > 2) { ctx.strokeStyle = `rgba(190,210,235,${.1 * a})`; ctx.lineWidth = d.r * .6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(d.x, d.y - d.trail); ctx.lineTo(d.x, d.y); ctx.stroke(); }
    ctx.fillStyle = `rgba(14,20,32,${.35 * a})`; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 1.12, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(200,220,245,${.35 * a})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(d.x, d.y + d.r * .1, d.r, .2, Math.PI - .2); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${.7 * a})`; ctx.beginPath(); ctx.arc(d.x - d.r * .35, d.y - d.r * .35, Math.max(.8, d.r * .22), 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- bokeh ---------- */
const BOKEH = Array.from({ length: 46 }, () => ({ x: rnd(0, W), y: rnd(80, 760), r: rnd(30, 110), h: Math.random() < .7 ? `255,${190 + Math.random() * 40 | 0},${110 + Math.random() * 40 | 0}` : (Math.random() < .5 ? '140,180,255' : '255,120,110'), ph: rnd(0, 6), a: rnd(.08, .26) }));
function drawBokeh(t, a = 1, x0 = 0, y0 = 0, sx = 1, sy = 1) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const x = x0 + (b.x + Math.sin(t * .15 + b.ph) * 30) * sx, y = y0 + (b.y + Math.cos(t * .1 + b.ph) * 12) * sy;
    const al = b.a * a * (.75 + .25 * Math.sin(t * .8 + b.ph * 3));
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r * sx);
    g.addColorStop(0, `rgba(${b.h},${al})`); g.addColorStop(.72, `rgba(${b.h},${al * .8})`); g.addColorStop(1, `rgba(${b.h},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r * sx, 0, 7); ctx.fill();
  }
  ctx.restore();
}

/* ---------- steam ---------- */
function steam(x, y, h, t, a = 1, w = 1) {
  ctx.save(); ctx.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    const p = new Path2D();
    for (let i = 0; i <= 30; i++) {
      const q = i / 30, yy = y - q * h;
      const xx = x + (k - 1) * 14 * w + Math.sin(q * 5.5 - t * 1.8 + k * 2.1) * q * 26 * w + Math.sin(t * .6 + k) * q * 18 * w;
      i ? p.lineTo(xx, yy) : p.moveTo(xx, yy);
    }
    const g = ctx.createLinearGradient(0, y, 0, y - h);
    g.addColorStop(0, 'rgba(255,248,235,0)'); g.addColorStop(.18, `rgba(255,248,235,${.22 * a})`); g.addColorStop(1, 'rgba(255,248,235,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 16 * w; ctx.globalAlpha = .45; ctx.stroke(p);
    ctx.lineWidth = 5 * w; ctx.globalAlpha = 1; ctx.stroke(p);
  }
  ctx.restore();
}

/* ---------- umbrella ---------- */
function umbrella(open, color, t, drip = true) {
  const w = lerp(13, 92, open), rim = lerp(-185, -258, open), top = -330;
  ctx.strokeStyle = '#1a1414'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -140); ctx.lineTo(0, top - 10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -140); ctx.lineTo(0, -128); ctx.arc(7, -128, 7, Math.PI, 0, true); ctx.stroke();
  const p = new Path2D();
  p.moveTo(-w, rim);
  p.quadraticCurveTo(-w * .92, top + 6, 0, top);
  p.quadraticCurveTo(w * .92, top + 6, w, rim);
  const seg = 5;
  for (let i = seg; i > 0; i--) { const xa = -w + 2 * w * i / seg, xb = -w + 2 * w * (i - 1) / seg; p.quadraticCurveTo((xa + xb) / 2, rim - 12 * open - 2, xb, rim); }
  const g = ctx.createLinearGradient(-w, 0, w, 0);
  g.addColorStop(0, shade(color, -.35)); g.addColorStop(.45, color); g.addColorStop(1, shade(color, -.5));
  ctx.fillStyle = g; ctx.fill(p);
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
  for (let i = 1; i < seg; i++) { const xb = -w + 2 * w * i / seg; ctx.beginPath(); ctx.moveTo(0, top); ctx.quadraticCurveTo(xb * .7, top + 10, xb, rim - 10 * open); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-w * .8, rim - 20 * open); ctx.quadraticCurveTo(-w * .55, top + 14, -6, top + 4); ctx.stroke();
  if (drip && open > .8) {
    ctx.fillStyle = 'rgba(200,220,245,.7)';
    for (let i = 0; i <= seg; i++) { const xa = -w + 2 * w * i / seg; const q = mod(t * 1.3 + i * .37, 1); ctx.beginPath(); ctx.ellipse(xa, rim + q * 70, 1.5, 3, 0, 0, 7); ctx.globalAlpha = 1 - q; ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- person ---------- */
function person(x, y, s, o = {}) {
  const c = Object.assign({ coat: '#7a5532', pants: '#1d1f27', skin: '#d9ad88', hair: '#2b1d16', scarf: null, phase: 0, walk: 1, run: false, flip: false,
    umbrella: null, uOpen: 1, cup: false, sip: 0, cover: null, bag: null, alpha: 1, lean: 0, t: 0, hood: false }, o);
  ctx.save(); ctx.globalAlpha *= c.alpha; ctx.translate(x, y); ctx.scale(c.flip ? -s : s, s);
  const ph = c.phase, amp = c.run ? .8 : .42 * c.walk;
  const sw = Math.sin(ph) * amp;
  const bob = (c.run ? Math.abs(Math.cos(ph)) * 10 : Math.abs(Math.cos(ph)) * 4 * c.walk);
  ctx.translate(0, -bob);
  const hipY = -95;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const leg = (a, dark) => {
    const kx = Math.sin(a) * 46, ky = hipY + Math.cos(a) * 46;
    const bend = c.run ? (a < 0 ? 1.5 : .35) : (a < 0 ? .55 : .08) * c.walk;
    const sa = a - bend, fx = kx + Math.sin(sa) * 48, fy = ky + Math.cos(sa) * 48;
    ctx.strokeStyle = dark ? shade(c.pants, -.35) : c.pants; ctx.lineWidth = 15;
    ctx.beginPath(); ctx.moveTo(0, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    ctx.fillStyle = dark ? '#0b0b0e' : '#16161b'; ctx.beginPath(); ctx.ellipse(fx + 7, fy + 2, 13, 6, sa * .35, 0, 7); ctx.fill();
  };
  const arm = (pts, dark, col) => {
    ctx.strokeStyle = dark ? shade(col || c.coat, -.35) : (col || c.coat); ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.stroke();
    const hx = pts[pts.length - 2], hy = pts[pts.length - 1];
    ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(hx, hy, 6, 0, 7); ctx.fill();
  };
  leg(-sw, true);
  ctx.save(); ctx.translate(0, hipY); ctx.rotate(c.lean + (c.run ? .22 : 0)); ctx.translate(0, -hipY);

  // back arm
  const shX = 0, shY = -160;
  if (c.umbrella) {
    ctx.save(); ctx.translate(-4, -146); ctx.rotate(-.12 + Math.sin(c.t * 1.3) * .03 + (c.walk ? Math.sin(ph * 2) * .015 : 0)); ctx.translate(0, 146);
    umbrella(c.uOpen, c.umbrella, c.t); ctx.restore();
    arm([shX, shY, -10, -128, -4, -148], true);
  } else if (c.cover) {
    arm([shX, shY, -14, -190, -16, -214], true);
  } else {
    const a = -sw * (c.run ? 1.1 : 1);
    const ex = Math.sin(a) * 34, ey = shY + Math.cos(a) * 34, b2 = a + (c.run ? 1.4 : .35);
    arm([shX, shY, ex, ey, ex + Math.sin(b2) * 32, ey + Math.cos(b2) * 32], true);
  }
  ctx.restore();
  leg(sw, false);
  ctx.save(); ctx.translate(0, hipY); ctx.rotate(c.lean + (c.run ? .22 : 0)); ctx.translate(0, -hipY);
  // coat
  const cg = ctx.createLinearGradient(-26, 0, 26, 0);

/* ---------- street ---------- */
const LAMP_GAP = 620;
function drawStreet(scroll, t, opt = {}) {
  const { lampOn = 1 } = opt;
  // sky
  const sg = ctx.createLinearGradient(0, 0, 0, GROUND);
  sg.addColorStop(0, '#0b111c'); sg.addColorStop(.6, '#1c2638'); sg.addColorStop(1, '#2b3346');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, GROUND);
  // low clouds / mist
  ctx.save(); ctx.globalAlpha = .5;
  for (let i = 0; i < 6; i++) { const x = mod(i * 420 - scroll * .05 + t * 8, W + 600) - 300; glow(x, 120 + (i % 3) * 60, 380, 'rgba(70,84,108,A)', .35); }
  ctx.restore();
  drawStrip(FAR, scroll, .25);
  ctx.fillStyle = 'rgba(40,50,70,.35)'; ctx.fillRect(0, 0, W, GROUND);           // atmospheric haze
  drawStrip(NEAR, scroll, .6);
  // ground
  const gg = ctx.createLinearGradient(0, GROUND, 0, H);
  gg.addColorStop(0, '#1a2231'); gg.addColorStop(1, '#090d14');
  ctx.fillStyle = gg; ctx.fillRect(0, GROUND, W, H - GROUND);
  drawStripReflection(NEAR, scroll, .6, .32);
  // cobbles (perspective rows)
  ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
  for (let i = 0; i < 14; i++) { const y = GROUND + Math.pow(i / 14, 1.7) * (H - GROUND); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, GROUND, W, 6);           // curb shadow
  // puddles
  for (let i = 0; i < 4; i++) {
    const px = mod(i * 700 + 250 - scroll * 1.15, 2800) - 300, py = 790 + (i % 2) * 150, rw = 150 + (i % 3) * 50;
    ctx.save(); ctx.beginPath(); ctx.ellipse(px, py, rw, rw * .16, 0, 0, 7); ctx.clip();
    ctx.fillStyle = 'rgba(90,110,140,.18)'; ctx.fillRect(px - rw, py - 40, rw * 2, 80);
    ctx.strokeStyle = 'rgba(200,220,245,.25)'; ctx.lineWidth = 1.2;
    for (let k = 0; k < 4; k++) { const q = mod(t * .9 + k * .27 + i * .13, 1), rx = px + Math.sin(k * 7 + i) * rw * .5, r = q * 40;
      ctx.globalAlpha = 1 - q; ctx.beginPath(); ctx.ellipse(rx, py + Math.cos(k * 3) * 6, r, r * .25, 0, 0, 7); ctx.stroke(); }
    ctx.restore();
  }
  // lamps
  const lamps = [];
  const off = mod(scroll, LAMP_GAP);
  for (let x = -off + 120; x < W + LAMP_GAP; x += LAMP_GAP) {
    const lx = x, ly = 230;
    const flick = lampOn * (.92 + .08 * Math.sin(t * 13 + x));
    // reflection streak
    const rg = ctx.createLinearGradient(0, GROUND, 0, H);
    rg.addColorStop(0, `rgba(255,200,120,${.35 * flick})`); rg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = rg; ctx.fillRect(lx - 16 - 30, GROUND + 10, 92, H - GROUND);
    // post
    ctx.fillStyle = '#0d1016'; ctx.fillRect(lx - 4, ly, 8, GROUND + 40 - ly); ctx.fillRect(lx - 10, GROUND + 26, 20, 14);
    ctx.beginPath(); ctx.moveTo(lx - 16, ly + 8); ctx.lineTo(lx + 16, ly + 8); ctx.lineTo(lx + 10, ly - 26); ctx.lineTo(lx - 10, ly - 26); ctx.fill();
    ctx.fillStyle = `rgba(255,214,150,${flick})`; ctx.fillRect(lx - 9, ly - 20, 18, 24);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    glow(lx, ly - 8, 150, 'rgba(255,190,110,A)', .45 * flick);
    const cg = ctx.createLinearGradient(0, ly, 0, GROUND + 330);
    cg.addColorStop(0, `rgba(255,200,130,${.16 * flick})`); cg.addColorStop(1, 'rgba(255,200,130,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(lx - 10, ly); ctx.lineTo(lx + 260, GROUND + 330); ctx.lineTo(lx - 280, GROUND + 330); ctx.fill();
    ctx.restore();
    lamps.push({ x: lx, y: ly, a: flick });
  }
  return lamps;
}

function caption(text, sub, p, a0 = .1, a1 = .82, y = 930) {
  const a = smooth(a0, a0 + .12, p) * (1 - smooth(a1, a1 + .1, p));

  if (sub) { ctx.globalAlpha = a * .7; ctx.font = '300 30px "Cormorant Garamond", Georgia, serif'; ctx.fillText(sub, W / 2, y + 50); }
  ctx.restore();
}

function sStrangers(t, p, dt) {

  ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(wx, wy + wh + 26); ctx.lineTo(wx + ww, wy + wh + 26); ctx.lineTo(wx + ww + 260, H); ctx.lineTo(wx - 160, H); ctx.fill();

  ctx.fillStyle = '#ece6dc'; ctx.beginPath(); ctx.ellipse(640, 720, 140, 52, -.05, 0, 7); ctx.fill();                                     // pillow
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(650, 742, 120, 22, 0, 0, 7); ctx.fill();

const SCENES = [
  { name: 'coffee', dur: 10, fn: sCoffee, muffle: 900 },
  { name: 'street', dur: 11, fn: sWalk, muffle: 6000 },
  { name: 'memories', dur: 10, fn: sNostalgia, muffle: 2400 },
  { name: 'strangers', dur: 10, fn: sStrangers, muffle: 9000 },
  { name: 'home', dur: 11, fn: sHome, muffle: 5000 },
  { name: 'bed', dur: 14, fn: sBed, muffle: 700 },
];
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
const FADE = .9;

/* ============================================================
   LOOP / UI
   ============================================================ */
let T = 0, playing = true, last = performance.now(), curScene = -1;
function sceneAt(T) { let acc = 0; for (let i = 0; i < SCENES.length; i++) { if (T < acc + SCENES[i].dur) return [i, T - acc]; acc += SCENES[i].dur; } return [SCENES.length - 1, SCENES[SCENES.length - 1].dur - .001]; }
function render(dt) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(...base);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  const [i, lt] = sceneAt(T), S = SCENES[i];
  if (i !== curScene) { curScene = i; splashes.length = 0; audioScene(S); }
  S.fn(lt, lt / S.dur, dt);
  const f = 1 - smooth(0, FADE, lt) * (1 - smooth(S.dur - FADE, S.dur, lt));
  if (f > 0) { ctx.fillStyle = `rgba(5,7,11,${f})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  fill.style.width = (T / TOTAL * 100) + '%';
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) T = (T + dt) % TOTAL;
  render(playing ? dt : 0);
  requestAnimationFrame(frame);
}
const fill = document.getElementById('fill'), bar = document.getElementById('bar'), ui = document.getElementById('ui');
{ let acc = 0; for (const s of SCENES.slice(0, -1)) { acc += s.dur; const d = document.createElement('div'); d.className = 'tick'; d.style.left = (acc / TOTAL * 100) + '%'; bar.appendChild(d); } }
bar.addEventListener('click', e => { const r = bar.getBoundingClientRect(); T = clamp((e.clientX - r.left) / r.width) * TOTAL; });
const playBtn = document.getElementById('play');
function togglePlay() { playing = !playing; playBtn.textContent = playing ? '❚❚ pause' : '▶ play'; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
playBtn.addEventListener('click', togglePlay);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); togglePlay(); } if (e.key === 'm') toggleSound(); });
let idle; function wake() { ui.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => ui.classList.add('hide'), 2600); }
addEventListener('pointermove', wake); addEventListener('pointerdown', wake); wake();

/* ---------- procedural rain sound + soft notes ---------- */
let AC = null, master, lp, soundOn = false, noteTimer;
function startAudio() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const len = AC.sampleRate * 4, buf = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); let lastv = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; lastv = (lastv + .02 * w) / 1.02; d[i] = lastv * 3 + w * .12 + (Math.random() < .0009 ? (Math.random() - .5) * 1.2 : 0); } }
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 120;
  const rg = AC.createGain(); rg.gain.value = .55;
  src.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(master); src.start();
  const scale = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];
  const note = () => {
    if (!soundOn) return;
    const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = scale[Math.floor(Math.random() * scale.length)] * (Math.random() < .3 ? .5 : 1);
    f.type = 'lowpass'; f.frequency.value = 1400; const now = AC.currentTime;
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.045, now + .04); g.gain.exponentialRampToValueAtTime(.0001, now + 3.5);
    o.connect(f); f.connect(g); g.connect(master); o.start(now); o.stop(now + 3.6);
  };
  noteTimer = setInterval(() => { if (Math.random() < .55) note(); }, 1400);
}
function audioScene(S) { if (AC && lp) lp.frequency.setTargetAtTime(S.muffle, AC.currentTime, .6); }
const sndBtn = document.getElementById('snd');
function toggleSound() {
  if (!AC) startAudio();
  soundOn = !soundOn; if (AC.state === 'suspended') AC.resume();
  master.gain.setTargetAtTime(soundOn ? .8 : 0, AC.currentTime, .4);
  sndBtn.textContent = soundOn ? '♪ sound on' : '♪ sound off';
  if (curScene >= 0) audioScene(SCENES[curScene]);
}
sndBtn.addEventListener('click', toggleSound);

/* test hook: render a given timestamp (warms up rain state first) */
window.__renderAt = (t) => { playing = false; T = t; for (let k = 0; k < 40; k++) { T = Math.max(0, t - (40 - k) / 60); render(1 / 60); } T = t; render(1 / 60); };
/* capture hook: render exactly one frame at time t, advancing simulation by dt */
window.__capture = (t, dt) => { playing = false; T = t; render(dt); return cv.toDataURL('image/jpeg', .9); };
window.__TOTAL = TOTAL;
const q = new URLSearchParams(location.search);
if (q.has('capture')) ui.style.display = 'none'; if (q.has('t')) T = +q.get('t') % TOTAL;
document.fonts && document.fonts.ready.then(() => {});
requestAnimationFrame(frame);
</script>
