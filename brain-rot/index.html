<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعفّن الدماغ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@500&display=swap" rel="stylesheet">
<style>
  /* Layout: one 9:16 canvas fitted to the screen, a slim player bar under it. Single dark look. */
  :root { --bg: #0d0c12; --ink: #f3eee8; --line: rgba(243,238,232,.22); --accent: #ff5f7e; --btn: #211e2a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #stage { position: relative; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.55); max-width: 100%; }
  #art { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 10px; direction: ltr; font: 500 13px/1 system-ui, sans-serif; max-width: 100%; }
  #controls button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--btn); color: var(--ink); font-size: 15px; cursor: pointer; display: grid; place-items: center; flex: none; }
  #controls button:hover { border-color: rgba(243,238,232,.55); }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #bar { position: relative; flex: 1; min-width: 0; height: 28px; cursor: pointer; touch-action: none; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 2px; background: var(--line); }
  #fill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; border-radius: 2px; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 74px; text-align: right; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 15px system-ui, sans-serif; color: rgba(243,238,232,.6); }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="art" width="1080" height="1920" role="img" aria-label="تعفّن الدماغ: موشن غرافيك قصير عن أثر المحتوى السريع على العقل"></canvas>
    <div id="loading">…</div>
  </div>
  <div id="controls">
    <button id="pp" aria-label="إيقاف مؤقت" title="Pause / Play (Space)">❚❚</button>
    <button id="rp" aria-label="إعادة التشغيل" title="Replay">↺</button>
    <button id="snd" aria-label="الصوت" aria-pressed="false" title="Sound (M)">♪</button>
    <div id="bar" aria-label="Timeline"><div id="fill"></div></div>
    <div id="time">0:00 / 1:04</div>
  </div>
</main>
<script>
"use strict";
/* =====================================================================
   تعفّن الدماغ — Brain Rot
   A 64-second vertical motion graphic in six scenes, each in the visual
   language of one reference: the hypnotic spiral, the RGB head tunnel,
   the pink halftone TV wall, the glowing phone, the blue armchair room,
   and a warm dawn for the way out. Every frame is a pure function of time.
   ===================================================================== */
const W = 1080, H = 1920;
const art = document.getElementById('art');
const ctx = art.getContext('2d');
const BUF = document.createElement('canvas'); BUF.width = W; BUF.height = H;
const bctx = BUF.getContext('2d');

/* ---------------- helpers ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeBack = t => { t = clamp(t); const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const ar = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const TAU = Math.PI * 2;

function poly(g, pts) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fill(); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function reset(g) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.shadowBlur = 0; g.shadowColor = 'transparent'; g.filter = 'none'; g.setLineDash([]); }

/* ---------------- type ---------------- */
const DISP = '"Reem Kufi", "Noto Kufi Arabic", "Geeza Pro", sans-serif';
const BODY = '"IBM Plex Sans Arabic", "Noto Sans Arabic", "Geeza Pro", sans-serif';
const QUOTE = '"Noto Naskh Arabic", "Amiri", "Geeza Pro", serif';
function txt(g, s, x, y, o = {}) {
  g.save();
  g.globalAlpha *= (o.a ?? 1);
  g.font = `${o.w || 400} ${o.size || 44}px ${o.font || BODY}`;
  g.direction = 'rtl'; g.textAlign = o.al || 'center'; g.textBaseline = 'alphabetic';
  if ('letterSpacing' in g) g.letterSpacing = o.ls || '0px';
  if (o.sh) { g.shadowColor = o.sh; g.shadowBlur = o.blur ?? 26; }
  g.fillStyle = o.c || '#fff';
  g.fillText(s, x, y, o.max || W - 120);
  g.restore();
}
// a line that rises into place at t0 and (optionally) fades out at t1
function beat(g, s, x, y, lt, t0, o = {}, t1 = null) {
  const k = easeOut((lt - t0) / .8); if (k <= 0) return;
  let a = k; if (t1 != null) a *= 1 - smooth(t1, t1 + .5, lt); if (a <= 0) return;
  txt(g, s, x, y + (1 - k) * 34, { ...o, a: (o.a ?? 1) * a });
}

/* ---------------- figures ---------------- */
// A man seen from behind. Origin at his feet; one unit = 100*s px; total height ≈ 9 units.
function figure(g, x, fy, s, P, o = {}) {
  const u = 100 * s;
  g.save(); g.translate(x, fy); g.scale(u, u); if (o.rot) g.rotate(o.rot);
  g.fillStyle = P.trou;
  poly(g, [[-0.95, -4.0], [-0.06, -4.0], [-0.16, -0.25], [-0.82, -0.25]]);
  poly(g, [[0.06, -4.0], [0.95, -4.0], [0.82, -0.25], [0.16, -0.25]]);
  g.fillStyle = P.shoe; ell(g, -0.5, -0.14, 0.44, 0.2); ell(g, 0.5, -0.14, 0.44, 0.2);
  g.fillStyle = P.skin; g.fillRect(-0.28, -8.0, 0.56, 0.75);
  ell(g, -0.53, -8.32, 0.12, 0.2); ell(g, 0.53, -8.32, 0.12, 0.2);
  ell(g, 0, -8.35, 0.52, 0.62);
  g.fillStyle = P.hair; ell(g, 0, -8.47, 0.54, 0.55);
  // jacket
  g.fillStyle = P.suit;
  g.beginPath(); g.moveTo(-0.32, -7.45);
  g.bezierCurveTo(-0.9, -7.42, -1.45, -7.3, -1.56, -6.75); g.lineTo(-1.4, -3.55); g.lineTo(1.4, -3.55); g.lineTo(1.56, -6.75);
  g.bezierCurveTo(1.45, -7.3, 0.9, -7.42, 0.32, -7.45); g.closePath(); g.fill();
  g.fillStyle = P.collar; poly(g, [[-0.36, -7.52], [0.36, -7.52], [0.27, -7.18], [-0.27, -7.18]]);
  g.strokeStyle = P.shade; g.lineWidth = 0.06; g.lineCap = 'round';
  g.beginPath(); g.moveTo(0, -7.18); g.lineTo(0, -3.6); g.moveTo(0, -4.5); g.lineTo(0.12, -3.6); g.stroke();
  // arms
  g.strokeStyle = P.arm; g.lineWidth = 0.62; g.lineJoin = 'round';
  if (o.hands === 'back') {
    g.beginPath(); g.moveTo(-1.42, -6.8); g.quadraticCurveTo(-1.78, -5.2, -1.15, -4.62); g.lineTo(-0.38, -4.48); g.stroke();
    g.beginPath(); g.moveTo(1.42, -6.8); g.quadraticCurveTo(1.78, -5.2, 1.15, -4.62); g.lineTo(0.38, -4.48); g.stroke();
    g.fillStyle = P.skin; ell(g, -0.26, -4.46, 0.24, 0.18); ell(g, 0.26, -4.46, 0.24, 0.18);
    if (o.hat) {
      g.fillStyle = P.hat; ell(g, 0.42, -3.86, 0.66, 0.44, 0.35);
      g.fillStyle = P.hatD; ell(g, 0.42, -3.86, 0.36, 0.25, 0.35);
      g.fillStyle = P.hat; ell(g, 0.42, -3.92, 0.3, 0.19, 0.35);
    }
  } else {
    g.beginPath(); g.moveTo(-1.44, -6.8); g.quadraticCurveTo(-1.72, -5.1, -1.64, -4.0); g.stroke();
    g.beginPath(); g.moveTo(1.44, -6.8); g.quadraticCurveTo(1.72, -5.1, 1.64, -4.0); g.stroke();
    g.fillStyle = P.skin; ell(g, -1.64, -3.78, 0.2, 0.28); ell(g, 1.64, -3.78, 0.2, 0.28);
  }
  g.restore();
}
const solid = c => ({ trou: c, shoe: c, skin: c, hair: c, suit: c, collar: c, shade: c, arm: c, hat: c, hatD: c });
// silhouette + offset rim light
function litFigure(g, x, fy, s, P, rim, offs, o) {
  for (const [dx, dy] of offs) figure(g, x + dx, fy + dy, s, solid(rim), o);
  figure(g, x, fy, s, P, o);
}

/* ---------------- grain (shared print texture) ---------------- */
const GRAIN = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'), d = x.createImageData(540, 960), r = mulberry32(99 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
});
function grain(g, t, amt = .13) {
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = amt;
  g.drawImage(GRAIN[Math.floor(t * 12) % 3], 0, 0, W, H); g.restore();
}
function vignette(g, a = .55) {
  const v = g.createRadialGradient(W / 2, H * .48, H * .28, W / 2, H * .5, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${a})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function bandTop(g, h, c = '0,0,0', a = .9) { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`); g.fillStyle = gr; g.fillRect(0, 0, W, h); }
function bandBot(g, y, c = '0,0,0', a = .9) { const gr = g.createLinearGradient(0, y, 0, H); gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(.45, `rgba(${c},${a * .85})`); gr.addColorStop(1, `rgba(${c},${a})`); g.fillStyle = gr; g.fillRect(0, y, W, H - y); }
// slice the frame sideways for a moment of signal loss
function glitch(g, amt, seed, n = 9) {
  const r = mulberry32(seed);
  for (let i = 0; i < n; i++) { const y = r() * H, h = 12 + r() * 90, dx = (r() - .5) * 2 * amt; g.drawImage(g.canvas, 0, y, W, h, dx, y, W, h); }
}

/* =====================================================================
   SCENE 1 — the spiral (0–10s)
   ===================================================================== */
const MAN1 = { suit: '#9db8b4', shade: '#6f8e8b', collar: '#bcd0cb', arm: '#89a7a3', trou: '#8fabaa', shoe: '#2f3233', skin: '#d0a089', hair: '#d8d8d4', hat: '#7f9aa8', hatD: '#38464f' };
function spiral(g, cx, cy, z, rot, col, alpha = 1) {
  g.save(); g.translate(cx, cy); g.scale(z, z); g.rotate(rot); g.globalAlpha *= alpha; g.fillStyle = col;
  const R = th => 14 * Math.pow(th, 1.35), Wd = th => 29.7 * Math.pow(th, .35);
  const a0 = 1.6, a1 = 36, st = .05;
  g.beginPath();
  for (let th = a0; th <= a1; th += st) { const r = R(th) + Wd(th); g.lineTo(Math.cos(th) * r, Math.sin(th) * r); }
  for (let th = a1; th >= a0; th -= st) { const r = Math.max(0, R(th) - Wd(th)); g.lineTo(Math.cos(th) * r, Math.sin(th) * r); }
  g.closePath(); g.fill();
  ell(g, 0, 0, 26, 26);
  g.restore();
}
function s1(g, lt) {
  g.fillStyle = '#0b0b0d'; g.fillRect(0, 0, W, H);
  const cx = 540, cy = 860;
  const z = (1 + lt * .02) * (1 + ease(smooth(8.4, 10.8, lt)) * 3.2);
  spiral(g, cx, cy, z, -lt * 1.25, '#dcd8d0');
  // a soft wobble in the paper
  const gl = g.createRadialGradient(cx, cy, 0, cx, cy, 900); gl.addColorStop(0, 'rgba(255,255,255,.08)'); gl.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  // he walks into it
  const k = ease(clamp(lt / 9.2));
  const s = lerp(1.08, .5, k), fy = lerp(1990, 1290, k);
  const fa = 1 - smooth(8.2, 9.4, lt);
  if (fa > 0) { g.save(); g.globalAlpha = fa; g.fillStyle = 'rgba(0,0,0,.35)'; ell(g, cx, fy - 6 * s, 170 * s, 22 * s); figure(g, cx + Math.sin(lt * 2.2) * 3 * s, fy, s, MAN1, { hands: 'back', hat: true, rot: Math.sin(lt * 2.2) * .008 }); g.restore(); }
  bandTop(g, 620, '8,8,10', .97);
  bandBot(g, 1500, '8,8,10', .9);
  beat(g, 'ظاهرة من زمن الشاشات', 540, 168, lt, .5, { size: 36, c: '#b9b3aa', w: 400 }, 8.2);
  beat(g, 'تعفّن الدماغ', 540, 340, lt, .9, { size: 160, font: DISP, w: 700, c: '#f6f2ea', sh: 'rgba(0,0,0,.8)' }, 8.4);
  beat(g, 'BRAIN ROT', 540, 418, lt, 1.5, { size: 30, c: '#8f8a82', w: 600, ls: '14px', font: '"IBM Plex Sans Arabic", system-ui, sans-serif' }, 8.4);
  beat(g, 'حين يغرق العقل في دوّامة', 540, 1712, lt, 4.4, { size: 50, w: 600, c: '#f1ece4' }, 8.0);
  beat(g, 'التمرير الذي لا ينتهي', 540, 1786, lt, 4.9, { size: 50, w: 600, c: '#f1ece4' }, 8.0);
}

/* =====================================================================
   SCENE 2 — the head tunnel (10–20s)
   ===================================================================== */
const HX = 560, HY = 860, HS = 430;
function headPath(g) {
  const P = (x, y) => [HX + x * HS, HY + y * HS];
  g.beginPath();
  g.moveTo(...P(1.0, 2.6));
  g.lineTo(...P(0.82, 1.12));
  g.quadraticCurveTo(...P(0.52, 0.9), ...P(0.38, 0.72));
  g.quadraticCurveTo(...P(0.43, 0.5), ...P(0.46, 0.25));
  g.bezierCurveTo(...P(0.62, -0.1), ...P(0.56, -0.56), ...P(0.25, -0.72));
  g.bezierCurveTo(...P(0.02, -0.86), ...P(-0.32, -0.82), ...P(-0.43, -0.56));
  g.quadraticCurveTo(...P(-0.51, -0.4), ...P(-0.48, -0.25));
  g.quadraticCurveTo(...P(-0.5, -0.12), ...P(-0.58, -0.02));
  g.lineTo(...P(-0.66, 0.12));
  g.quadraticCurveTo(...P(-0.62, 0.17), ...P(-0.56, 0.18));
  g.lineTo(...P(-0.585, 0.26));
  g.quadraticCurveTo(...P(-0.54, 0.3), ...P(-0.575, 0.34));
  g.quadraticCurveTo(...P(-0.56, 0.46), ...P(-0.45, 0.5));
  g.quadraticCurveTo(...P(-0.3, 0.55), ...P(-0.25, 0.63));
  g.lineTo(...P(-0.22, 0.86));
  g.quadraticCurveTo(...P(-0.5, 1.0), ...P(-0.86, 1.12));
  g.lineTo(...P(-1.05, 2.6));
  g.closePath();
}
const sgnpow = (v, p) => Math.sign(v) * Math.pow(Math.abs(v), p);
function ring(g, cx, cy, r, i, lt, dx, dy) {
  g.beginPath();
  const n = 150;
  for (let k = 0; k <= n; k++) {
    const a = k / n * TAU;
    const w = Math.sin(a * 6 + lt * 1.6 + i * .5) * .028 + Math.sin(a * 17 - lt * 3.1 + i * 1.3) * .010 + Math.sin(a * 3 - lt * .7 + i * .2) * .02;
    const rr = r * (1 + w);
    const x = cx + rr * sgnpow(Math.cos(a), .72) + dx, y = cy + rr * 1.16 * sgnpow(Math.sin(a), .72) + dy;
    k ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
}
function s2(g, lt) {
  g.fillStyle = '#050507'; g.fillRect(0, 0, W, H);
  const z = lerp(1.12, 1.0, easeOut(lt / 3));
  g.save(); g.translate(540, 900); g.scale(z, z); g.translate(-540, -900);
  const cx = HX + .04 * HS, cy = HY + .06 * HS;
  const N = 30, sp = 38, r0 = .66 * HS;
  g.globalCompositeOperation = 'lighter'; g.lineWidth = 3.2; g.lineJoin = 'round';
  const jitter = 1 + smooth(5, 9, lt) * 2.2;     // the signal frays as the scene goes on
  for (let i = 0; i < N; i++) {
    const p = (i + lt * 1.15) % N, r = r0 + p * sp;
    const a = smooth(0, 1.2, p) * (1 - smooth(N - 7, N, p));
    if (a <= 0) continue;
    const ii = Math.floor(i + lt * 1.15 - p + 1000);
    g.globalAlpha = a * .95;
    g.strokeStyle = '#ff2b4e'; ring(g, cx, cy, r, ii, lt, -6 * jitter, -2);
    g.strokeStyle = '#2bff9a'; ring(g, cx, cy, r, ii, lt, 0, 3 * jitter);
    g.strokeStyle = '#3a6bff'; ring(g, cx, cy, r, ii, lt, 6 * jitter, -1);
    g.globalAlpha = a * .55; g.strokeStyle = '#ffffff'; g.lineWidth = 1.6; ring(g, cx, cy, r, ii, lt, 0, 0); g.lineWidth = 3.2;
  }
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  // the silhouette
  headPath(g); g.fillStyle = '#121215'; g.fill();
  g.save(); headPath(g); g.clip();
  const hl = g.createLinearGradient(HX - HS, 0, HX + HS, 0); hl.addColorStop(0, 'rgba(255,255,255,.05)'); hl.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = hl; g.fillRect(0, 0, W, H); g.restore();
  // target on the mind
  const dx = HX - .02 * HS, dy = HY - .27 * HS;
  const flick = (Math.sin(lt * 23) > .6 && lt > 5) ? .35 : 1;
  g.strokeStyle = `rgba(255,255,255,${.55 * flick})`; g.lineWidth = 3; g.setLineDash([14, 12]);
  g.beginPath(); g.moveTo(dx, dy); g.lineTo(HX - .36 * HS, H); g.moveTo(dx, dy); g.lineTo(HX + .02 * HS, H); g.stroke(); g.setLineDash([]);
  g.beginPath(); g.arc(dx, dy, 100, 0, TAU); g.stroke();
  const pk = (lt * .8) % 1; g.strokeStyle = `rgba(255,255,255,${(1 - pk) * .5})`; g.beginPath(); g.arc(dx, dy, 18 + pk * 120, 0, TAU); g.stroke();
  g.fillStyle = `rgba(255,255,255,${flick})`; ell(g, dx, dy, 17, 17);
  g.restore();
  // signal loss
  for (const [a, b, s] of [[3.9, 4.15, 11], [6.6, 6.85, 23], [8.3, 8.6, 37], [9.2, 9.45, 41]]) if (lt > a && lt < b) glitch(g, 60, s + Math.floor(lt * 30));
  bandTop(g, 420, '5,5,7', .95);
  bandBot(g, 1440, '5,5,7', .96);
  beat(g, 'ما هو؟', 540, 170, lt, .6, { size: 36, c: '#8ef0c3', w: 600 });
  beat(g, 'تراجعٌ في صفاء الذهن', 540, 268, lt, 1.0, { size: 78, font: DISP, w: 700, c: '#ffffff' });
  beat(g, 'تدهورٌ في الحالة الذهنية والقدرة على التفكير،', 540, 1600, lt, 2.6, { size: 42, c: '#eef0f6' });
  beat(g, 'سببه الإفراط في استهلاك محتوى سريع وسطحي', 540, 1666, lt, 3.2, { size: 42, c: '#eef0f6' });
  beat(g, 'لا يتطلّب أي جهد من العقل.', 540, 1732, lt, 3.8, { size: 42, c: '#eef0f6' });

  g.fillStyle = '#3c1c27'; poly(g, [[176, 1214], [452, 1172], [448, 1200], [186, 1236]]);

/* =====================================================================
   SCENE 6 — the way back (52–64s)
   ===================================================================== */
const DOT = { x: (SCR.x + SCR.w / 2 - 540) * 1.08 + 540, y: (SCR.y + SCR.h / 2 - 1000) * 1.08 + 1000 };
const DARK = { suit: '#1a1222', shade: '#1a1222', collar: '#1a1222', arm: '#1a1222', trou: '#1a1222', shoe: '#1a1222', skin: '#1a1222', hair: '#1a1222', hat: '#1a1222', hatD: '#1a1222' };
function tipIcon(g, k, x, y, a) {

  g.strokeStyle = 'rgba(255,207,138,.45)'; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, 42, 0, TAU); g.stroke();
  g.strokeStyle = '#ffcf8a'; g.lineWidth = 3.5; g.lineCap = 'round'; g.lineJoin = 'round';

  } else if (k === 1) { // hourglass

  } else if (k === 2) { // open book

  } else { // leaf

const TIPS = ['أطفئ الإشعارات غير الضرورية', 'حدّد وقتاً يومياً للشاشة والتزم به', 'اقرأ نصاً طويلاً كل يوم، ولو صفحات', 'امشِ بلا هاتف، ودع عقلك يملّ قليلاً'];
function s6(g, lt) {
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const sx = 540, sy = 560;
  const m = ease(clamp(lt / 1.6));
  const x = lerp(DOT.x, sx, m), y = lerp(DOT.y, sy, m), R = lerp(7, 150, ease(clamp((lt - .6) / 2.2)));
  const dawn = smooth(.8, 4, lt);
  // sky
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgba(40,26,64,${dawn})`); sky.addColorStop(.3, `rgba(110,52,78,${dawn})`); sky.addColorStop(.46, `rgba(232,128,88,${dawn})`); sky.addColorStop(.47, `rgba(40,24,44,${dawn})`); sky.addColorStop(1, `rgba(16,12,24,${dawn})`);
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  spiral(g, sx, sy, 1 + lt * .14, lt * .5, '#ffd9a6'); g.restore();
  // sun
  const halo = g.createRadialGradient(x, y, 0, x, y, R * 4.5); halo.addColorStop(0, 'rgba(255,214,150,.75)'); halo.addColorStop(.3, 'rgba(255,160,100,.28)'); halo.addColorStop(1, 'rgba(255,120,80,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, H);
  g.save(); g.shadowColor = '#ffe3b0'; g.shadowBlur = 60; g.fillStyle = lt < .8 ? '#f4f7ff' : '#ffe1a8'; ell(g, x, y, R, R); g.restore();

/* =====================================================================
   timeline + compositing
   ===================================================================== */
const SC = [
  { start: 0, fn: s1 }, { start: 10, fn: s2 }, { start: 20, fn: s3 },
  { start: 31, fn: s4 }, { start: 42, fn: s5 }, { start: 52, fn: s6 },
];
const FADE = [0, .9, .9, .9, .9, 0];   // crossfade length into each scene (s6 is a hard cut from the dot)
const TOTAL = 64;
const sceneAt = T => { for (let i = SC.length - 1; i >= 0; i--) if (T >= SC[i].start) return i; return 0; };
function drawScene(g, i, t) { g.save(); reset(g); SC[i].fn(g, t); g.restore(); reset(g); }
function renderFrame(T) {
  const i = sceneAt(T), lt = T - SC[i].start, f = FADE[i];
  if (i > 0 && f > 0 && lt < f) {
    drawScene(ctx, i - 1, T - SC[i - 1].start);
    drawScene(bctx, i, lt);
    ctx.globalAlpha = ease(lt / f); ctx.drawImage(BUF, 0, 0); ctx.globalAlpha = 1;
  } else drawScene(ctx, i, lt);
  vignette(ctx, i === 2 ? .25 : .5);
  grain(ctx, T, i === 2 ? .16 : .12);

/* =====================================================================
   sound: a drone, TV hiss and a warm chord at the end, all synthesized
   ===================================================================== */
let AC = null, AU = null;
function audioInit() {
  if (AC) return; AC = new (window.AudioContext || window.webkitAudioContext)();
  const master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.connect(master);
  const drone = AC.createGain(); drone.gain.value = 0; drone.connect(lp);
  const oscs = [55, 82.4, 110.3].map((f, i) => { const o = AC.createOscillator(); o.type = i ? 'sawtooth' : 'sine'; o.frequency.value = f; const g = AC.createGain(); g.gain.value = i ? .12 : .6; o.connect(g); g.connect(drone); o.start(); return o; });
  const lfo = AC.createOscillator(); lfo.frequency.value = .18; const lg = AC.createGain(); lg.gain.value = 180; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
  const nb = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = .6;
  const hiss = AC.createGain(); hiss.gain.value = 0; ns.connect(bp); bp.connect(hiss); hiss.connect(master); ns.start();
  const wlp = AC.createBiquadFilter(); wlp.type = 'lowpass'; wlp.frequency.value = 1400; wlp.connect(master);
  const warm = AC.createGain(); warm.gain.value = 0; warm.connect(wlp);
  [196, 246.9, 293.7, 392].forEach((f, i) => { const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4; const g = AC.createGain(); g.gain.value = .16; o.connect(g); g.connect(warm); o.start(); });
  AU = { drone, hiss, warm, oscs };
}
function audioUpdate(T, on) {
  if (!AU) return;
  const i = sceneAt(T), lt = T - SC[i].start, now = AC.currentTime;
  let dr = [.32, .3, .2, .26, .24, 0][i], hs = [.008, .03, .025, .015, .05, 0][i], wm = i === 5 ? .32 * smooth(.6, 3, lt) : 0;
  if (i === 1 && [[3.9, 4.15], [6.6, 6.85], [8.3, 8.6], [9.2, 9.45]].some(([a, b]) => lt > a && lt < b)) hs = .14;
  if (i === 4 && lt > 8.6) { dr = 0; hs = 0; }
  if (!on) dr = hs = wm = 0;
  AU.drone.gain.setTargetAtTime(dr, now, .25); AU.hiss.gain.setTargetAtTime(hs, now, .08); AU.warm.gain.setTargetAtTime(wm, now, .6);

/* =====================================================================
   PLAYER
   ===================================================================== */
const stage = document.getElementById('stage'), controls = document.getElementById('controls');
const pp = document.getElementById('pp'), rp = document.getElementById('rp'), snd = document.getElementById('snd'), bar = document.getElementById('bar'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
function layout() { const aw = innerWidth - 32, ah = innerHeight - 24 - 52, w = Math.max(160, Math.min(aw, ah * 9 / 16)); stage.style.width = w + 'px'; stage.style.height = (w * 16 / 9) + 'px'; controls.style.width = Math.max(w, Math.min(aw, 340)) + 'px'; }
addEventListener('resize', layout); layout();
const q = new URLSearchParams(location.search);
const CAPTURE = q.has('capture');
let T = 0, playing = false, ended = false, last = 0, ready = false, sound = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(p) { playing = p; pp.textContent = p ? '❚❚' : '▶'; pp.setAttribute('aria-label', p ? 'إيقاف مؤقت' : 'تشغيل'); }
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (ready && !CAPTURE) {
    if (playing && !ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; setPlaying(false); } }
    renderFrame(Math.min(T, TOTAL - .001));
    audioUpdate(T, sound && playing && !ended);
    fill.style.width = (Math.min(T, TOTAL) / TOTAL * 100) + '%'; timeEl.textContent = `${fmt(Math.min(T, TOTAL))} / ${fmt(TOTAL)}`;
  }

}
function replay() { T = 0; ended = false; setPlaying(true); }
pp.addEventListener('click', () => { if (ended) { replay(); return; } setPlaying(!playing); });

snd.addEventListener('click', () => { sound = !sound; snd.setAttribute('aria-pressed', String(sound)); if (sound) { try { audioInit(); AC.resume(); } catch (e) { sound = false; snd.setAttribute('aria-pressed', 'false'); } } });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.click(); } if (e.key === 'm' || e.key === 'M') snd.click(); });

window.__TOTAL = TOTAL;

const fontLoads = [`700 80px "Reem Kufi"`, `400 40px "IBM Plex Sans Arabic"`, `600 40px "IBM Plex Sans Arabic"`, `500 46px "Noto Naskh Arabic"`].map(f => document.fonts.load(f, 'تعفّن الدماغ'));
Promise.race([Promise.all(fontLoads).catch(() => {}), new Promise(r => setTimeout(r, 3500))]).then(() => {
  ready = true; document.getElementById('loading').remove(); window.__ready = true;
  if (q.has('t')) T = +q.get('t');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

});
