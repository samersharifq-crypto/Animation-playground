<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ما وراء المألوف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0c0b09; --ink: #efe4cf; --line: rgba(239,228,207,.22); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; }
  #stage { position: relative; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #art { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 12px; direction: ltr; font: 500 13px/1 system-ui, sans-serif; }
  #controls button {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #17150f; color: var(--ink);
    font-size: 15px; cursor: pointer; display: grid; place-items: center; flex: none;
  }
  #controls button:hover { border-color: rgba(239,228,207,.55); }
  #controls button:focus-visible { outline: 2px solid #e2b765; outline-offset: 2px; }
  #bar { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 2px; background: var(--line); }
  #fill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; border-radius: 2px; background: #e2b765; }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 74px; text-align: right; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 15px system-ui, sans-serif; color: rgba(239,228,207,.6); }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="art" width="1080" height="1920" role="img" aria-label="ما وراء المألوف — رسوم متحركة"></canvas>
    <div id="loading">…</div>
  </div>
  <div id="controls">
    <button id="pp" aria-label="إيقاف مؤقت" title="Pause / Play (Space)">❚❚</button>
    <button id="rp" aria-label="إعادة التشغيل" title="Replay">↺</button>
    <div id="bar" aria-label="Timeline"><div id="fill"></div></div>
    <div id="time">0:00 / 1:05</div>
  </div>
</main>
<script>
"use strict";
/* =====================================================================
   ما وراء المألوف — Beyond the Familiar
   A 65-second vertical (9:16) illustrated motion piece, drawn live on
   canvas. Every frame is a pure function of time, so it can be scrubbed,
   paused, replayed, and recorded frame-by-frame.
   ===================================================================== */
const W = 1080, H = 1920;
const art = document.getElementById('art');
const MAIN = art.getContext('2d');
let ctx = MAIN;

/* ---------------- helpers ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const mod = (a, n) => ((a % n) + n) % n;
function canvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const k = f < 0 ? 0 : 255, a = Math.abs(f);
  return `rgb(${Math.round(lerp(r, k, a))},${Math.round(lerp(g, k, a))},${Math.round(lerp(b, k, a))})`;
}
function radial(x, y, r, rgb, a, c = ctx) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
function poly(pts, c = ctx) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function cam(pwx, pwy, psx, psy, s) { ctx.translate(psx, psy); ctx.scale(s, s); ctx.translate(-pwx, -pwy); }
function vignette(a, c = ctx) {
  const g = c.createRadialGradient(W / 2, H * .46, H * .28, W / 2, H * .5, H * .78);
  g.addColorStop(0, 'rgba(8,7,5,0)'); g.addColorStop(1, `rgba(8,7,5,${a})`);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

/* ---------------- textures ---------------- */
function makeMud(w, h, base, seed, o = {}) {
  const { blot = 1, cracks = 20, straw = true, gold = false, strokes = 1 } = o;
  const c = canvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  const nb = Math.floor(w * h / 2600);
  for (let i = 0; i < nb; i++) {
    const x = r() * w, y = r() * h, rad = (24 + r() * 130) * blot, light = r() < .5;
    radial(x, y, rad, light ? '255,238,205' : '38,26,14', .045 + r() * .06, g);
  }
  // painterly vertical brush strokes
  for (let i = 0; i < w * h / 700 * strokes; i++) {
    const x = r() * w, y = r() * h, l = 10 + r() * 60, light = r() < .5;
    g.strokeStyle = `rgba(${light ? '250,232,200' : '30,20,10'},${.025 + r() * .05})`;
    g.lineWidth = 2 + r() * 7; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 10, y + l); g.stroke();
  }
  if (straw) for (let i = 0; i < w * h / 1100; i++) {
    const x = r() * w, y = r() * h, l = 4 + r() * 14;
    g.strokeStyle = `rgba(${r() < .5 ? '240,220,180' : '60,40,20'},${.08 + r() * .14})`; g.lineWidth = .9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (r() - .5) * 4); g.stroke();
  }
  for (let i = 0; i < cracks; i++) {
    let x = r() * w, y = r() * h;
    g.strokeStyle = `rgba(28,18,10,${.14 + r() * .2})`; g.lineWidth = .7 + r() * 1.3;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 7; k++) { x += (r() - .5) * 46; y += r() * 34; g.lineTo(x, y); }
    g.stroke();
    if (gold) { g.strokeStyle = `rgba(214,168,88,${.18 + r() * .2})`; g.lineWidth = 1.2; g.stroke(); }
  }
  if (gold) for (let i = 0; i < w * h / 4000; i++) {
    const x = r() * w, y = r() * h;
    g.fillStyle = `rgba(222,178,96,${.1 + r() * .25})`; g.fillRect(x, y, 2 + r() * 9, 1 + r() * 3);
  }
  return c;
}

function makeDoorTex(w, h, seed, o = {}) {
  const { paint = true, studs = true, old = false } = o;
  const c = canvas(w, h), g = c.getContext('2d'), r = mulberry32(seed);
  const planks = 5, pw = w / planks, k = w / 250;
  for (let i = 0; i < planks; i++) {
    const v = old ? 0.85 : 1;
    g.fillStyle = `rgb(${(96 + r() * 22) * v | 0},${(70 + r() * 14) * v | 0},${(46 + r() * 10) * v | 0})`;
    g.fillRect(i * pw, 0, pw + 1, h);
    for (let n = 0; n < 34 * k; n++) {
      const x = i * pw + r() * pw;
      g.strokeStyle = `rgba(${r() < .55 ? '30,18,10' : '190,150,105'},${.06 + r() * .13})`; g.lineWidth = .6 + r() * 1.8 * k;
      g.beginPath(); g.moveTo(x, 0); let xx = x;
      for (let y = 0; y <= h; y += 30) { xx += (r() - .5) * 3; g.lineTo(clamp(xx, i * pw, (i + 1) * pw), y); }
      g.stroke();
    }
    for (let n = 0; n < 2; n++) {           // knots
      const kx = i * pw + pw * (.3 + r() * .4), ky = r() * h;
      g.strokeStyle = 'rgba(30,18,8,.35)'; g.lineWidth = 1.4 * k;
      for (let q = 1; q < 4; q++) { g.beginPath(); g.ellipse(kx, ky, q * 3 * k, q * 7 * k, 0, 0, 7); g.stroke(); }
    }
    g.fillStyle = 'rgba(18,10,5,.7)'; g.fillRect(i * pw - 1.5 * k, 0, 3 * k, h);
  }
  // weathering
  for (let n = 0; n < 60 * k; n++) radial(r() * w, h * (.55 + r() * .45), 20 * k + r() * 40 * k, '220,200,170', .05 + r() * .06, g);
  if (paint) {
    const by = h * .1, bh = h * .07, n = 8, tw = w / n;
    for (let i = 0; i < n; i++) {
      g.fillStyle = `rgba(196,150,80,${old ? .32 : .5})`; poly([i * tw, by + bh, i * tw + tw / 2, by, (i + 1) * tw, by + bh], g); g.fill();
      g.fillStyle = `rgba(232,220,196,${old ? .25 : .42})`; poly([i * tw + tw / 2, by, (i + 1) * tw, by + bh, (i + 1) * tw + tw / 2, by], g); g.fill();
    }
    g.fillStyle = `rgba(30,22,14,${old ? .3 : .45})`; g.fillRect(0, by - 6 * k, w, 4 * k); g.fillRect(0, by + bh + 2 * k, w, 4 * k);
    const by2 = h * .86;
    for (let i = 0; i < n; i++) { g.fillStyle = `rgba(196,150,80,${old ? .25 : .4})`; poly([i * tw, by2, i * tw + tw / 2, by2 + bh * .7, (i + 1) * tw, by2], g); g.fill(); }
  }
  g.fillStyle = 'rgba(25,16,9,.35)'; g.fillRect(0, h * .3, w, 10 * k); g.fillRect(0, h * .68, w, 10 * k);  // battens
  if (studs) for (const yy of [.3, .68]) for (let i = 0; i < 9; i++) {
    const x = (i + .5) * w / 9, y = h * yy + 5 * k;
    g.fillStyle = '#1a140e'; g.beginPath(); g.arc(x, y, 3.2 * k, 0, 7); g.fill();
    g.fillStyle = 'rgba(230,200,150,.35)'; g.beginPath(); g.arc(x - k, y - k, 1.1 * k, 0, 7); g.fill();
  }
  // ring knocker
  g.strokeStyle = '#1b140e'; g.lineWidth = 4 * k; g.beginPath(); g.arc(w * .82, h * .5, 12 * k, 0, 7); g.stroke();
  g.strokeStyle = 'rgba(225,190,130,.35)'; g.lineWidth = 1.2 * k; g.beginPath(); g.arc(w * .82, h * .5, 12 * k, -2.4, -1); g.stroke();
  // edge shade
  const eg = g.createLinearGradient(0, 0, w, 0); eg.addColorStop(0, 'rgba(0,0,0,.25)'); eg.addColorStop(.15, 'rgba(0,0,0,0)'); eg.addColorStop(.85, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(0,0,0,.3)');
  g.fillStyle = eg; g.fillRect(0, 0, w, h);
  return c;
}

const PAINT = (() => {                                         // oil-canvas texture overlay
  const c = canvas(), g = c.getContext('2d'), r = mulberry32(11);
  g.fillStyle = '#808080'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 16000; i++) {
    const x = r() * W, y = r() * H, l = 10 + r() * 70, a = r() < .8 ? (r() - .5) * .5 : Math.PI / 2 + (r() - .5) * .3;
    const v = r() < .5 ? 255 : 0;
    g.strokeStyle = `rgba(${v},${v},${v},${.03 + r() * .06})`; g.lineWidth = 1 + r() * 5;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.sin(a) * l, y + Math.cos(a) * l); g.stroke();
  }
  return c;
})();
const GRAIN = (() => { const c = canvas(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c; })();
const GRAIN_PAT = MAIN.createPattern(GRAIN, 'repeat');

/* ---------------- shared motifs ---------------- */
function drawLeaf(x, y, len, rot, fill, vein = 'rgba(80,50,20,.6)', sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sy);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(-len / 2, 0);
  ctx.bezierCurveTo(-len * .2, -len * .34, len * .25, -len * .28, len / 2, 0);
  ctx.bezierCurveTo(len * .25, len * .28, -len * .2, len * .34, -len / 2, 0); ctx.fill();
  if (len > 14) {
    ctx.strokeStyle = vein; ctx.lineWidth = Math.max(1, len * .022);
    ctx.beginPath(); ctx.moveTo(-len * .64, len * .02); ctx.lineTo(len * .46, 0); ctx.stroke();
    ctx.lineWidth = Math.max(.6, len * .01);
    for (let i = 1; i < 5; i++) { const px = -len / 2 + len * i / 5, k = .17 * (1 - Math.abs(i - 2.5) / 4);
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px + len * .13, -len * k); ctx.moveTo(px, 0); ctx.lineTo(px + len * .13, len * k); ctx.stroke(); }
  }
  ctx.restore();
}
function steam(x, y, h, t, a = 1, w = 1) {
  ctx.save(); ctx.lineCap = 'round';
  for (const [o, wt] of [[0, 1], [1.9, .55], [3.4, .4]]) {
    const p = new Path2D();
    for (let i = 0; i <= 44; i++) {
      const q = i / 44, yy = y - q * h;
      const xx = x + (Math.sin(q * 4.0 - t * .85 + o) * .62 + Math.sin(q * 7.3 - t * 1.3 + o * 2) * .22) * q * 72 * w + Math.sin(t * .3 + o) * q * 34 * w + (o ? (o - 2.6) * 6 * w * q : 0);
      i ? p.lineTo(xx, yy) : p.moveTo(xx, yy);
    }
    const g = ctx.createLinearGradient(0, y, 0, y - h);
    g.addColorStop(0, 'rgba(246,238,222,0)'); g.addColorStop(.1, `rgba(246,238,222,${.5 * a * wt})`);
    g.addColorStop(.55, `rgba(246,238,222,${.22 * a * wt})`); g.addColorStop(1, 'rgba(246,238,222,0)');
    ctx.strokeStyle = g;
    for (const [lw, al] of [[36, .1], [18, .22], [7, .55], [2.4, .9]]) { ctx.globalAlpha = al; ctx.lineWidth = lw * w; ctx.stroke(p); }
  }
  ctx.restore();
}

/* ---------------- the man ---------------- */
const SKIN = '#8f6446';
// profile head; origin = neck base, facing +x. ~178 units tall.
function headProfile(look = 0, light = 1) {
  ctx.save(); ctx.rotate(-look * .2);
  ctx.fillStyle = shade(SKIN, -.2); poly([-18, 10, -14, -62, 24, -62, 28, 10]); ctx.fill();
  ctx.fillStyle = SKIN; ctx.beginPath();
  ctx.moveTo(-40, -70); ctx.bezierCurveTo(-58, -110, -48, -160, -5, -170); ctx.bezierCurveTo(30, -174, 52, -150, 54, -122);
  ctx.lineTo(58, -108); ctx.lineTo(70, -86); ctx.lineTo(58, -80); ctx.lineTo(60, -70); ctx.lineTo(55, -62);
  ctx.bezierCurveTo(56, -50, 46, -42, 30, -42); ctx.bezierCurveTo(10, -42, -8, -52, -20, -58); ctx.closePath(); ctx.fill();
  // beard (short, touched with grey)
  ctx.fillStyle = '#231b15'; ctx.beginPath(); ctx.moveTo(-8, -98); ctx.bezierCurveTo(4, -80, 22, -76, 46, -78); ctx.lineTo(61, -70); ctx.lineTo(56, -61);
  ctx.bezierCurveTo(57, -46, 46, -38, 28, -38); ctx.bezierCurveTo(8, -38, -10, -50, -22, -60); ctx.lineTo(-16, -96); ctx.fill();
  ctx.beginPath(); ctx.ellipse(57, -78, 9, 3.6, .25, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(170,160,150,.35)'; for (let i = 0; i < 9; i++) ctx.fillRect(4 + i * 5.5, -52 - (i % 3) * 5, 2, 5);
  // hair
  ctx.fillStyle = '#1b1613'; ctx.beginPath(); ctx.moveTo(-42, -80); ctx.bezierCurveTo(-64, -122, -50, -176, 0, -180);
  ctx.bezierCurveTo(36, -182, 56, -160, 53, -134); ctx.bezierCurveTo(40, -148, 22, -150, 8, -142); ctx.bezierCurveTo(-4, -128, -14, -118, -16, -100); ctx.lineTo(-30, -80); ctx.fill();
  ctx.strokeStyle = 'rgba(120,100,80,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(-34 + i * 11, -166 + Math.abs(i - 3) * 4, 6, 3.6, 5.8); ctx.stroke(); }
  ctx.fillStyle = shade(SKIN, -.12); ctx.beginPath(); ctx.ellipse(-9, -104, 9, 15, .1, 0, 7); ctx.fill();
  ctx.strokeStyle = '#1a120c'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(37, -107); ctx.lineTo(48, -105 - look * 2); ctx.stroke();
  ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(34, -119); ctx.lineTo(52, -117); ctx.stroke();
  if (light > 0) { ctx.strokeStyle = `rgba(242,204,136,${.6 * light})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(51, -140); ctx.lineTo(55, -110); ctx.lineTo(69, -87); ctx.stroke(); }
  ctx.restore();
}
const TH = '#ece4d5', TH_M = '#c7bca9', TH_D = '#8e8474';

function chair(x, y, dark = 1) {         // bentwood chair, seat top at (x,y)
  ctx.save(); ctx.strokeStyle = `rgba(42,30,20,${dark})`; ctx.lineCap = 'round';
  ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(x - 40, y + 6); ctx.quadraticCurveTo(x - 70, y - 160, x - 30, y - 280); ctx.quadraticCurveTo(x + 20, y - 330, x + 60, y - 260); ctx.stroke();
  ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x - 30, y); ctx.quadraticCurveTo(x - 46, y - 140, x - 14, y - 240); ctx.stroke();
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x - 46, y + 10); ctx.lineTo(x - 66, y + 232); ctx.moveTo(x + 90, y + 10); ctx.lineTo(x + 108, y + 232); ctx.stroke();
  ctx.fillStyle = `rgba(48,34,22,${dark})`; ctx.beginPath(); ctx.ellipse(x + 22, y + 6, 110, 16, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(214,170,100,.28)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 24, y - 286); ctx.quadraticCurveTo(x + 20, y - 326, x + 56, y - 262); ctx.stroke();
  ctx.restore();
}

// seated at the window table, profile facing right
function seatedMan(o) {
  const look = o.look || 0, light = o.light ?? 1;
  ctx.fillStyle = TH_M; ctx.beginPath(); ctx.moveTo(522, 1190); ctx.lineTo(616, 1186); ctx.quadraticCurveTo(634, 1300, 644, 1424); ctx.lineTo(512, 1428); ctx.quadraticCurveTo(510, 1300, 522, 1190); ctx.fill();
  ctx.strokeStyle = 'rgba(90,80,64,.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(560, 1220); ctx.lineTo(552, 1420); ctx.moveTo(600, 1230); ctx.lineTo(612, 1418); ctx.stroke();
  ctx.fillStyle = '#2a1d14'; ctx.beginPath(); ctx.ellipse(616, 1437, 48, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.ellipse(626, 1429, 24, 7, 0, 0, 7); ctx.fill();
  const g = ctx.createLinearGradient(290, 0, 470, 0); g.addColorStop(0, TH_D); g.addColorStop(.5, TH_M); g.addColorStop(1, TH);
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(335, 872); ctx.quadraticCurveTo(298, 900, 296, 980); ctx.quadraticCurveTo(290, 1120, 300, 1222);
  ctx.lineTo(600, 1236); ctx.quadraticCurveTo(628, 1212, 612, 1180); ctx.lineTo(452, 1160);
  ctx.quadraticCurveTo(454, 1040, 448, 960); ctx.quadraticCurveTo(442, 900, 420, 876); ctx.quadraticCurveTo(380, 862, 335, 872); ctx.fill();
  ctx.strokeStyle = 'rgba(80,70,56,.3)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(340, 960); ctx.quadraticCurveTo(330, 1080, 344, 1200); ctx.moveTo(470, 1172); ctx.quadraticCurveTo(530, 1190, 590, 1196); ctx.moveTo(440, 900); ctx.lineTo(444, 1030); ctx.stroke();
  if (light > 0) { ctx.strokeStyle = `rgba(242,206,140,${.45 * light})`; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(424, 880); ctx.quadraticCurveTo(446, 905, 450, 980); ctx.stroke(); }
  ctx.save(); ctx.translate(398, 884); headProfile(look, light); ctx.restore();
  ctx.fillStyle = TH; ctx.beginPath(); ctx.ellipse(402, 884, 30, 9, -.1, 0, 7); ctx.fill();
}
function cupPos(lift) { return { x: 660 - lift * 22, y: 1028 - lift * 46 }; }
function seatedArm(o) {
  const lift = o.lift || 0, c = cupPos(lift);
  const hx = c.x - 50, hy = c.y + 26, ex = 440, ey = 1066 - lift * 16;
  const g = ctx.createLinearGradient(0, 880, 0, 1100); g.addColorStop(0, TH_M); g.addColorStop(1, TH);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = g;
  ctx.lineWidth = 56; ctx.beginPath(); ctx.moveTo(392, 910); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.lineWidth = 44; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx - 24, hy + 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(80,70,56,.28)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex + 10, ey + 14); ctx.lineTo(hx - 40, hy + 14); ctx.stroke();

/* =====================================================================
   SCENE 6 — THE SAME WORLD, SEEN AGAIN
   ===================================================================== */
function s6(t) {
  const e = ease(t / 9.5);
  ctx.save(); cam(640, 760, 640, 760, lerp(1.12, 1, e));
  const det = smooth(.3, 5.5, t);

/* =====================================================================
   TIMELINE, TEXT & TRANSITIONS
   ===================================================================== */
const SC = [
  { start: 0, dur: 10, fn: s1, beats: [['في كل صباح، نفتح أعيننا على الأشياء نفسها.', 1.0, 5.0, 1580], ['حتى نظن أننا لم نعد نحتاج إلى النظر.', 5.4, 9.2, 1580]] },
  { start: 10, dur: 10, fn: s2, beats: [['نمضي في الطرق التي نحفظها،', 1.2, 5.2, 1590], ['ونعبر التفاصيل كأنها لم تعد تحمل شيئًا جديدًا.', 5.6, 9.3, 1590]] },
  { start: 20, dur: 11, fn: s3, beats: [['لكن تفصيلًا صغيرًا قد يوقظ انتباهنا…', 1.1, 5.6, 340], ['ويجعلنا نسأل: ماذا فاتنا ونحن نعبر؟', 6.0, 9.8, 340]] },
  { start: 31, dur: 12, fn: s4, beats: [['خلف ما ألفناه، قد تختبئ حكاية لم نسمعها،', 1.1, 6.0, 340], ['وجمالٌ لم نمنحه لحظةً من انتباهنا.', 6.4, 11.0, 340]] },
  { start: 43, dur: 11, fn: s5, beats: [['ليست الأشياء دائمًا هي التي تفقد دهشتها…', 1.0, 4.9, 340], ['لعلّ نظرتنا هي التي اعتادت المرور سريعًا.', 5.8, 10.0, 1580]] },
  { start: 54, dur: 11, fn: s6, beats: [['تمهّل… وانظر مرة أخرى.', 1.0, 4.3, 1580], ['قد تبدأ الدهشة من المكان الذي ظننت أنك تعرفه.', 4.7, 8.5, 1580], ['ما وراء المألوف', 9.0, 1e9, 1560, 88]] },
];
const TOTAL = 65;
const TR = [
  { a: 9.5, z: 11.0, to: 1, type: 'iris' },
  { a: 19.4, z: 20.9, to: 2, type: 'beam' },
  { a: 42.5, z: 43.4, to: 4, type: 'fade' },
  { a: 53.1, z: 54.1, to: 5, type: 'fade' },

const FONT = '"Noto Naskh Arabic", "Amiri", "FreeSerif", "Geeza Pro", "Times New Roman", serif';
function lines(str, max) {

  const words = str.split(' '); let best = null, bw = 1e9;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    const m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (m < bw) { bw = m; best = [a, b]; }
  }

}

  const ls = lines(str, 860), lh = size * 1.8, y0 = y - (ls.length - 1) * lh / 2 + rise;
  ctx.globalAlpha = a; ctx.save(); ctx.translate(W / 2, y + rise); ctx.scale(1, .22 + .14 * ls.length);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 560); g.addColorStop(0, 'rgba(10,8,6,.5)'); g.addColorStop(.6, 'rgba(10,8,6,.3)'); g.addColorStop(1, 'rgba(10,8,6,0)');
  ctx.fillStyle = g; ctx.fillRect(-560, -560, 1120, 1120); ctx.restore();
  ctx.fillStyle = '#f2e7d2'; ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 2;

    for (const [str, t0, t1, y, size] of S.beats) {

const BA = canvas(), BB = canvas();
function renderInto(c, i, t) { const prev = ctx; ctx = c.getContext('2d'); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; SC[i].fn(t); ctx.restore(); ctx = prev; }

/* =====================================================================
   PLAYER
   ===================================================================== */
const stage = document.getElementById('stage'), controls = document.getElementById('controls');
const pp = document.getElementById('pp'), rp = document.getElementById('rp'), bar = document.getElementById('bar'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
function layout() {
  const aw = innerWidth - 32, ah = innerHeight - 24 - 52;
  const w = Math.max(160, Math.min(aw, ah * 9 / 16));
  stage.style.width = w + 'px'; stage.style.height = (w * 16 / 9) + 'px'; controls.style.width = Math.max(w, Math.min(aw, 320)) + 'px';
}
addEventListener('resize', layout); layout();
let T = 0, playing = false, ended = false, last = 0, ambient = 0, ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(p) { playing = p; pp.textContent = p ? '❚❚' : '▶'; pp.setAttribute('aria-label', p ? 'إيقاف مؤقت' : 'تشغيل'); }
function tick(now) {

    if (playing) { if (!ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; } } else ambient += dt; }
    renderFrame(ended ? TOTAL - .001 + ambient : T);
    fill.style.width = (Math.min(T, TOTAL) / TOTAL * 100) + '%'; timeEl.textContent = `${fmt(Math.min(T, TOTAL))} / ${fmt(TOTAL)}`;
  }

}
function replay() { T = 0; ended = false; ambient = 0; setPlaying(true); }
pp.addEventListener('click', () => { if (ended && !playing) { setPlaying(true); return; } setPlaying(!playing); });
rp.addEventListener('click', replay);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.click(); } });
function seek(clientX) { const r = bar.getBoundingClientRect(); T = clamp((clientX - r.left) / r.width) * TOTAL; ended = T >= TOTAL; ambient = 0; }
bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); seek(e.clientX); });
bar.addEventListener('pointermove', e => { if (e.buttons) seek(e.clientX); });

/* frame-exact hook for recording */
window.__frame = (t, type = 'image/jpeg') => { renderFrame(t); return art.toDataURL(type, .93); };
window.__TOTAL = TOTAL;

const q = new URLSearchParams(location.search);
const fontReady = Promise.race([
  Promise.all([document.fonts.load(`400 54px "Noto Naskh Arabic"`, 'ما وراء'), document.fonts.load(`400 54px FreeSerif`, 'ما')]).catch(() => {}),
  new Promise(r => setTimeout(r, 3500))]);
fontReady.then(() => {
  courtSnap();
  ready = true; document.getElementById('loading').remove();
  window.__ready = true;
  if (q.has('t')) T = +q.get('t');

requestAnimationFrame(tick);
