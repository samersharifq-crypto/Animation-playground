<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ما وراء المألوف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17121a; --ink: #f5eee2; --line: rgba(245,238,226,.22); --accent: #f2bf5e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  #wrap { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 16px; }
  #stage { position: relative; background: #000; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  #art { display: block; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 12px; direction: ltr; font: 500 13px/1 system-ui, sans-serif; }
  #controls button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: #241c26; color: var(--ink); font-size: 15px; cursor: pointer; display: grid; place-items: center; flex: none; }
  #controls button:hover { border-color: rgba(245,238,226,.55); }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bar { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  #bar::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 2px; border-radius: 2px; background: var(--line); }
  #fill { position: absolute; left: 0; top: 13px; height: 2px; width: 0; border-radius: 2px; background: var(--accent); }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 74px; text-align: right; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font: 400 15px system-ui, sans-serif; color: rgba(245,238,226,.6); }
</style>
</head>
<body>
<main id="wrap">
  <div id="stage">
    <canvas id="art" width="1080" height="1920" role="img" aria-label="ما وراء المألوف — رسوم متحركة"></canvas>
    <div id="loading">…</div>
  </div>
  <div id="controls">
    <button id="pp" aria-label="إيقاف مؤقت" title="Pause / Play (Space)">❚❚</button>
    <button id="rp" aria-label="إعادة التشغيل" title="Replay">↺</button>
    <div id="bar" aria-label="Timeline"><div id="fill"></div></div>
    <div id="time">0:00 / 1:05</div>
  </div>
</main>
<script>
"use strict";
/* =====================================================================
   ما وراء المألوف — Beyond the Familiar
   65 s, 9:16. Flat editorial illustration: solid shapes, a limited palette,
   hard-edged rim light, cinematic backlight and printed grain.
   Every frame is a pure function of time (scrub / pause / replay / record).
   ===================================================================== */
const W = 1080, H = 1920;
const art = document.getElementById('art');
const MAIN = art.getContext('2d');
let ctx = MAIN;

/* ---------------- palette ---------------- */
const C = {
  ink: '#211a24', plum: '#3b2a38', plum2: '#4f3947', plum3: '#6a4b58',
  teal: '#2c5761', teal2: '#467b83', teal3: '#7ba6a5', teal4: '#b3cec6',
  coral: '#a9533f', coral2: '#c66c50', coral3: '#de9470', sand: '#efc39a',
  cream: '#f5eee2', cream2: '#e2d7c4', thS: '#a3b6b3', thD: '#6e878a',
  skin: '#c07f5f', skinS: '#7f4c3d', hair: '#1d1619',
  gold: '#f2bf5e', gold2: '#ffdc8e', wood: '#6a3c33', wood2: '#80493c', wood3: '#53302a',
};

/* ---------------- helpers ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => (t = clamp(t), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const mod = (a, n) => ((a % n) + n) % n;
function canvas(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function radial(x, y, r, hex, a, c = ctx) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(hex, a)); g.addColorStop(1, rgba(hex, 0)); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }
function poly(pts, c = ctx) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
function P(pts) { const p = new Path2D(); p.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) p.lineTo(pts[i], pts[i + 1]); p.closePath(); return p; }
function cam(pwx, pwy, psx, psy, s) { ctx.translate(psx, psy); ctx.scale(s, s); ctx.translate(-pwx, -pwy); }
// flat shape with a hard-edged rim of light on the side facing the light (+dx = from the right, +dy = from above)
function rim(path, base, lit, dx, dy = 0) {
  ctx.fillStyle = lit; ctx.fill(path);
  ctx.save(); ctx.clip(path); ctx.translate(-dx, dy); ctx.fillStyle = base; ctx.fill(path); ctx.restore();
}
// soft grainy shadow inside a shape (the print grain turns the gradient into stipple)
function shadeIn(path, x0, y0, x1, y1, hex, a) {
  ctx.save(); ctx.clip(path); const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, rgba(hex, 0)); g.addColorStop(1, rgba(hex, a)); ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3); ctx.restore();
}
function vignette(a, c = ctx) {
  const g = c.createRadialGradient(W / 2, H * .46, H * .3, W / 2, H * .5, H * .8);
  g.addColorStop(0, rgba(C.ink, 0)); g.addColorStop(1, rgba(C.ink, a)); c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function tone(sat, warm = 0) {         // per-scene mood: saturation and warmth
  ctx.save();
  if (sat < 1) { ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = `rgba(128,128,128,${1 - sat})`; ctx.fillRect(0, 0, W, H); }
  if (warm > 0) { ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = rgba(C.gold, warm); ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ---------------- printed grain (3 boiling frames) ---------------- */
const GRAIN = [0, 1, 2].map(k => { const c = canvas(540, 960), g = c.getContext('2d'), d = g.createImageData(540, 960), r = mulberry32(900 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c; });
function grain(T, a = .2) {
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = a;
  ctx.drawImage(GRAIN[Math.floor(T * 12) % 3], 0, 0, W, H); ctx.restore();
}

/* ---------------- motifs ---------------- */
function drawLeaf(x, y, len, rot, fill, vein = null, sy = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, sy);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(-len / 2, 0);
  ctx.bezierCurveTo(-len * .2, -len * .34, len * .25, -len * .28, len / 2, 0);
  ctx.bezierCurveTo(len * .25, len * .28, -len * .2, len * .34, -len / 2, 0); ctx.fill();
  if (vein) { ctx.strokeStyle = vein; ctx.lineWidth = Math.max(1, len * .03); ctx.beginPath(); ctx.moveTo(-len * .6, 0); ctx.lineTo(len * .42, 0); ctx.stroke(); }
  ctx.restore();
}
function steam(x, y, h, t, a = 1, w = 1) {
  ctx.save(); ctx.lineCap = 'round';
  for (const [o, wt] of [[0, 1], [1.9, .55], [3.4, .4]]) {
    const p = new Path2D();
    for (let i = 0; i <= 44; i++) {
      const q = i / 44, yy = y - q * h;
      const xx = x + (Math.sin(q * 4.0 - t * .85 + o) * .62 + Math.sin(q * 7.3 - t * 1.3 + o * 2) * .22) * q * 72 * w + Math.sin(t * .3 + o) * q * 34 * w + (o ? (o - 2.6) * 6 * w * q : 0);
      i ? p.lineTo(xx, yy) : p.moveTo(xx, yy);
    }
    const g = ctx.createLinearGradient(0, y, 0, y - h);
    g.addColorStop(0, rgba(C.cream, 0)); g.addColorStop(.12, rgba(C.cream, .55 * a * wt)); g.addColorStop(.6, rgba(C.cream, .22 * a * wt)); g.addColorStop(1, rgba(C.cream, 0));
    ctx.strokeStyle = g; ctx.lineWidth = 14 * w; ctx.globalAlpha = .35; ctx.stroke(p); ctx.lineWidth = 5 * w; ctx.globalAlpha = 1; ctx.stroke(p);
  }
  ctx.restore();
}

/* =====================================================================
   THE MAN — flat shapes, white thobe in cool shadow, warm rim of light
   ===================================================================== */
const HEAD = P([-40, -70, -54, -98, -54, -132, -40, -158, -5, -172, 28, -172, 48, -156, 54, -122, 58, -108, 70, -86, 58, -80, 60, -70, 55, -62, 52, -48, 30, -42, 10, -43, -20, -58]);
const BEARD = P([-8, -98, 4, -84, 22, -77, 46, -78, 61, -70, 56, -61, 53, -46, 28, -37, 8, -38, -12, -50, -22, -60, -16, -96]);
const HAIR = P([-42, -80, -60, -112, -56, -150, -36, -174, 0, -182, 32, -178, 52, -160, 54, -134, 40, -148, 20, -150, 8, -142, -6, -128, -16, -100, -30, -80]);
// profile head; origin = neck base, facing +x. side: +1 light from the face side, -1 from behind
function headProfile(look = 0, side = 1) {
  ctx.save(); ctx.rotate(-look * .2);
  ctx.fillStyle = C.skinS; ctx.fillRect(-16, -64, 40, 72);
  rim(HEAD, C.skinS, C.skin, side > 0 ? 12 : -10, 4);
  ctx.fillStyle = C.hair; ctx.fill(BEARD); ctx.fill(HAIR);
  ctx.beginPath(); ctx.ellipse(57, -78, 9, 3.6, .25, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(C.cream, .35); for (let i = 0; i < 6; i++) ctx.fillRect(8 + i * 7, -50 - (i % 2) * 6, 2.4, 5);
  ctx.fillStyle = C.skinS; ctx.beginPath(); ctx.ellipse(-9, -104, 9, 15, .1, 0, 7); ctx.fill();
  ctx.strokeStyle = C.hair; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(38, -107); ctx.lineTo(48, -105 - look * 2); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(34, -120); ctx.lineTo(52, -118); ctx.stroke();
  ctx.restore();
}
let THL = C.cream, THB = C.thS, THD = C.thD;      // thobe: lit / base / deep
function chair(x, y, col = C.ink) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = 11; ctx.beginPath(); ctx.moveTo(x - 40, y + 6); ctx.quadraticCurveTo(x - 70, y - 160, x - 30, y - 280); ctx.quadraticCurveTo(x + 20, y - 330, x + 60, y - 260); ctx.stroke();
  ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(x - 30, y); ctx.quadraticCurveTo(x - 46, y - 140, x - 14, y - 240); ctx.stroke();
  ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(x - 46, y + 10); ctx.lineTo(x - 66, y + 232); ctx.moveTo(x + 90, y + 10); ctx.lineTo(x + 108, y + 232); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x + 22, y + 6, 110, 16, 0, 0, 7); ctx.fill();
  ctx.restore();
}
const S_ROBE = P([522, 1190, 616, 1186, 628, 1250, 636, 1330, 644, 1424, 512, 1428, 512, 1330, 516, 1250]);
const S_BODY = (() => { const p = new Path2D(); p.moveTo(335, 872); p.quadraticCurveTo(298, 900, 296, 980); p.quadraticCurveTo(290, 1120, 300, 1222);
  p.lineTo(600, 1236); p.quadraticCurveTo(628, 1212, 612, 1180); p.lineTo(452, 1160); p.quadraticCurveTo(454, 1040, 448, 960); p.quadraticCurveTo(442, 900, 420, 876); p.quadraticCurveTo(380, 862, 335, 872); p.closePath(); return p; })();
function seatedMan(o) {
  rim(S_ROBE, THD, THB, 16);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(616, 1437, 48, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.skinS; ctx.beginPath(); ctx.ellipse(626, 1429, 24, 7, 0, 0, 7); ctx.fill();
  rim(S_BODY, THB, THL, 22, 6);
  shadeIn(S_BODY, 0, 1000, 0, 1240, THD, .7);
  ctx.strokeStyle = rgba(THD, .6); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(340, 960); ctx.quadraticCurveTo(330, 1080, 344, 1200); ctx.moveTo(470, 1174); ctx.quadraticCurveTo(530, 1190, 590, 1198); ctx.stroke();
  ctx.save(); ctx.translate(398, 884); headProfile(o.look || 0, 1); ctx.restore();
  ctx.fillStyle = THL; ctx.beginPath(); ctx.ellipse(402, 884, 30, 9, -.1, 0, 7); ctx.fill();
}
function cupPos(lift) { return { x: 660 - lift * 22, y: 1028 - lift * 46 }; }
function seatedArm(o) {
  const lift = o.lift || 0, c = cupPos(lift), hx = c.x - 50, hy = c.y + 26, ex = 440, ey = 1066 - lift * 16;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = THB; ctx.lineWidth = 56; ctx.beginPath(); ctx.moveTo(392, 910); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.lineWidth = 44; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx - 24, hy + 2); ctx.stroke();
  ctx.strokeStyle = THL; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(ex + 18, ey - 16); ctx.lineTo(hx - 26, hy - 16); ctx.stroke();
  ctx.strokeStyle = THD; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(ex + 8, ey + 18); ctx.lineTo(hx - 30, hy + 20); ctx.stroke();
  ctx.fillStyle = C.skinS; ctx.beginPath(); ctx.ellipse(hx, hy, 27, 18, -.1, 0, 7); ctx.fill();
  ctx.fillStyle = C.skin; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(hx + 22, hy - 12 + i * 10, 11, 5.5, .1, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(hx + 6, hy - 13, 18, 5, -.1, 0, 7); ctx.fill();
  ctx.restore();
}
function drawCup(x, rimY, detail, glow = 0) {
  const h = 56; ctx.save();
  ctx.strokeStyle = C.cream2; ctx.lineWidth = 9; ctx.beginPath(); ctx.ellipse(x - 40, rimY + 24, 12, 15, 0, Math.PI * .5, Math.PI * 1.5); ctx.stroke();
  const body = new Path2D(); body.moveTo(x - 38, rimY); body.lineTo(x + 38, rimY); body.bezierCurveTo(x + 36, rimY + h * .7, x + 22, rimY + h, x, rimY + h); body.bezierCurveTo(x - 22, rimY + h, x - 36, rimY + h * .7, x - 38, rimY); body.closePath();
  rim(body, C.thS, C.cream, 18);
  if (detail > 0) { const r = mulberry32(77); ctx.fillStyle = rgba(C.thD, .5 * detail);
    for (let i = 0; i < 40; i++) { const u = r(), v = r(); ctx.fillRect(x - 32 + u * 62 * (1 - v * .3), rimY + 6 + v * (h - 12), 2, 2); }
    ctx.fillStyle = rgba(C.coral, .8 * detail); ctx.fillRect(x - 37, rimY + 14, 74, 5); }
  ctx.fillStyle = C.cream; ctx.beginPath(); ctx.ellipse(x, rimY, 38, 9, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#3a2219'; ctx.beginPath(); ctx.ellipse(x, rimY + 1, 33, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = rgba(C.gold, .7); ctx.beginPath(); ctx.ellipse(x + 12, rimY, 9, 1.8, 0, 0, 7); ctx.fill();
  if (glow > 0) { ctx.fillStyle = rgba(C.gold, glow); ctx.beginPath(); ctx.ellipse(x, rimY + 1, 33, 7, 0, 0, 7); ctx.fill(); }
  ctx.restore();
}
// standing / walking, profile facing +x; origin = feet; ~556 tall at s=1
function walkerProfile(x, y, s, o = {}) {
  const ph = o.phase || 0, wk = o.walk ?? 1, sw = Math.sin(ph) * wk, L = o.flip ? -1 : 1;   // L: local direction of the light
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.translate(x, y); ctx.scale(o.flip ? -s : s, s);
  ctx.translate(0, -Math.abs(Math.cos(ph)) * 5 * wk);
  const foot = (fx, lift, dark) => { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(fx + 8, -5 - lift, 26, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = dark ? C.skinS : C.skin; ctx.beginPath(); ctx.ellipse(fx + 10, -11 - lift, 17, 6, 0, 0, 7); ctx.fill(); };
  foot(-sw * 34, Math.max(0, -Math.cos(ph)) * 12 * wk, true);
  foot(sw * 34, Math.max(0, Math.cos(ph)) * 12 * wk, false);
  ctx.rotate(o.lean || 0);
  const body = new Path2D(); body.moveTo(-30, -470); body.quadraticCurveTo(-52, -440, -50, -380); body.quadraticCurveTo(-54, -200, -60 - sw * 9, -22);
  body.quadraticCurveTo(0, -12, 64 + sw * 11, -20); body.quadraticCurveTo(54, -200, 46, -330); body.quadraticCurveTo(48, -420, 30, -470); body.quadraticCurveTo(0, -478, -30, -470); body.closePath();
  rim(body, THB, THL, 20 * L, 4);
  shadeIn(body, 0, -260, 0, -10, THD, .65);
  ctx.strokeStyle = rgba(THD, .7); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-8, -300); ctx.quadraticCurveTo(-14, -150, -24 + sw * 8, -24); ctx.moveTo(30, -440); ctx.lineTo(32, -330); ctx.stroke();
  ctx.save(); ctx.translate(2, -470); ctx.scale(.5, .5); headProfile(o.look || 0, L); ctx.restore();
  ctx.fillStyle = THL; ctx.beginPath(); ctx.ellipse(3, -470, 15, 5, 0, 0, 7); ctx.fill();
  const reach = o.reach || 0;
  const hx = lerp(10 - sw * 26, o.reachX ?? 92, reach), hy = lerp(-250, o.reachY ?? -330, reach), ex = lerp(6 - sw * 12, 40, reach), ey = lerp(-350, -370, reach);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = THB; ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(4, -450); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = THL; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(4 + 11 * L, -446); ctx.lineTo(ex + 11 * L, ey); ctx.lineTo(hx + 9 * L, hy - 4); ctx.stroke();
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(hx + (reach ? 8 : 0), hy + 8, 10, 12, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function walkerBack(x, y, s, o = {}) {
  const ph = o.phase || 0, wk = o.walk ?? 1, look = o.look || 0;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.translate(x, y); ctx.scale(s, s);
  for (const side of [-1, 1]) { const lift = Math.max(0, side * Math.cos(ph)) * 14 * wk;
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(side * 22, -6 - lift, 16, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C.skinS; ctx.beginPath(); ctx.ellipse(side * 22, -16 - lift, 11, 9, 0, 0, 7); ctx.fill(); }
  ctx.translate(Math.sin(ph) * 4 * wk, -Math.abs(Math.cos(ph)) * 5 * wk);
  for (const side of [-1, 1]) { const swing = Math.cos(ph) * side * 10 * wk;
    const sl = P([side * 50, -455, side * 80, -360, side * 74, -250 + swing, side * 54, -250 + swing, side * 54, -360, side * 40, -440]);
    ctx.fillStyle = side < 0 ? THD : THL; ctx.fill(sl);
    ctx.fillStyle = side < 0 ? C.skinS : C.skin; ctx.beginPath(); ctx.ellipse(side * 65, -238 + swing, 10, 13, 0, 0, 7); ctx.fill(); }
  const body = new Path2D(); body.moveTo(-56, -462); body.quadraticCurveTo(-64, -300, -70, -24 + Math.sin(ph) * 4 * wk);
  body.quadraticCurveTo(0, -14, 70, -24 - Math.sin(ph) * 4 * wk); body.quadraticCurveTo(64, -300, 56, -462); body.quadraticCurveTo(0, -484, -56, -462); body.closePath();
  rim(body, THB, THL, 30, 6);
  shadeIn(body, 0, -300, 0, -10, THD, .6);
  ctx.strokeStyle = rgba(THD, .7); ctx.lineWidth = 2.5; for (const fx of [-26, 2]) { ctx.beginPath(); ctx.moveTo(fx * .6, -430); ctx.quadraticCurveTo(fx, -240, fx * 1.15 + Math.sin(ph + fx) * 5 * wk, -26); ctx.stroke(); }
  ctx.fillStyle = C.skinS; ctx.fillRect(-13, -500, 26, 36); ctx.fillStyle = C.skin; ctx.fillRect(4, -500, 9, 36);
  ctx.fillStyle = THL; ctx.beginPath(); ctx.ellipse(0, -466, 22, 7, 0, 0, 7); ctx.fill();
  const hy = -540 - look * 6;
  ctx.fillStyle = C.skinS; ctx.beginPath(); ctx.ellipse(-35, hy + 4, 6, 11, 0, 0, 7); ctx.fill(); ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(35, hy + 4, 6, 11, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.ellipse(0, hy - look * 4, 35, 44 - look * 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.plum3; ctx.beginPath(); ctx.ellipse(24, hy - 14 - look * 4, 8, 26, .2, 0, 7); ctx.fill();
  ctx.restore();
}

/* =====================================================================
   SCENE 1 & 6 — THE ROOM
   ===================================================================== */
const WIN = { x0: 400, x1: 1000, y0: 110, y1: 1080 };
const EXT = (() => {               // soft, out-of-focus morning beyond the glass

    ctx.drawImage(BA, 0, 0);
    const b = BB.getContext('2d'); b.save(); b.globalCompositeOperation = 'destination-in';
    if (tr.type === 'iris') { const k = lerp(.95, 9, Math.pow(ease(q), 1.4)); b.translate(540, 1450); b.scale(250 * k, 64 * k); b.fillStyle = '#000'; b.beginPath(); b.arc(0, 0, 1, 0, 7); b.fill(); }
    else if (tr.type === 'beam') { const { Pt, u, n, hw } = beamGeom(q); b.fillStyle = '#000';
      poly([Pt[0] - u[0] * 3000 - n[0] * hw, Pt[1] - u[1] * 3000 - n[1] * hw, Pt[0] + u[0] * 3000 - n[0] * hw, Pt[1] + u[1] * 3000 - n[1] * hw, Pt[0] + u[0] * 3000 + n[0] * hw, Pt[1] + u[1] * 3000 + n[1] * hw, Pt[0] - u[0] * 3000 + n[0] * hw, Pt[1] - u[1] * 3000 + n[1] * hw], b); b.fill(); }
    else { b.fillStyle = `rgba(0,0,0,${ease(q)})`; b.fillRect(0, 0, W, H); }
    b.restore();
    ctx.drawImage(BB, 0, 0);
    if (tr.type === 'iris') { const k = lerp(.95, 9, Math.pow(ease(q), 1.4)); ctx.save(); ctx.strokeStyle = rgba(C.gold, 1 - q); ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(540, 1450, 250 * k, 64 * k, 0, 0, 7); ctx.stroke(); ctx.restore(); }
    if (tr.type === 'beam') { const { Pt, u, n, hw } = beamGeom(q); ctx.save(); ctx.strokeStyle = rgba(C.gold2, 1 - q * .7); ctx.lineWidth = 8;
      for (const sg of [-1, 1]) { ctx.beginPath(); ctx.moveTo(Pt[0] - u[0] * 3000 + sg * n[0] * hw, Pt[1] - u[1] * 3000 + sg * n[1] * hw); ctx.lineTo(Pt[0] + u[0] * 3000 + sg * n[0] * hw, Pt[1] + u[1] * 3000 + sg * n[1] * hw); ctx.stroke(); }
      ctx.restore(); }
  }
  grain(T, .22);
  drawTexts(T);
}

/* =====================================================================
   PLAYER
   ===================================================================== */
const stage = document.getElementById('stage'), controls = document.getElementById('controls');
const pp = document.getElementById('pp'), rp = document.getElementById('rp'), bar = document.getElementById('bar'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
function layout() { const aw = innerWidth - 32, ah = innerHeight - 24 - 52, w = Math.max(160, Math.min(aw, ah * 9 / 16));
  stage.style.width = w + 'px'; stage.style.height = (w * 16 / 9) + 'px'; controls.style.width = Math.max(w, Math.min(aw, 320)) + 'px'; }
addEventListener('resize', layout); layout();
let T = 0, playing = false, ended = false, last = 0, ambient = 0, ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function setPlaying(p) { playing = p; pp.textContent = p ? '❚❚' : '▶'; pp.setAttribute('aria-label', p ? 'إيقاف مؤقت' : 'تشغيل'); }
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000 || 0); last = now;
  if (ready) {
    if (playing) { if (!ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; } } else ambient += dt; }
    renderFrame(ended ? TOTAL - .001 + ambient : T);
    fill.style.width = (Math.min(T, TOTAL) / TOTAL * 100) + '%'; timeEl.textContent = `${fmt(Math.min(T, TOTAL))} / ${fmt(TOTAL)}`;
  }
  requestAnimationFrame(tick);
}
function replay() { T = 0; ended = false; ambient = 0; setPlaying(true); }
pp.addEventListener('click', () => { if (ended && !playing) { setPlaying(true); return; } setPlaying(!playing); });
rp.addEventListener('click', replay);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); pp.click(); } });
function seek(clientX) { const r = bar.getBoundingClientRect(); T = clamp((clientX - r.left) / r.width) * TOTAL; ended = T >= TOTAL; ambient = 0; }
bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); seek(e.clientX); });
bar.addEventListener('pointermove', e => { if (e.buttons) seek(e.clientX); });
window.__frame = (t, type = 'image/jpeg') => { renderFrame(t); return art.toDataURL(type, .93); };
window.__TOTAL = TOTAL;
const q = new URLSearchParams(location.search);
Promise.race([
  Promise.all([document.fonts.load(`400 54px "Noto Naskh Arabic"`, 'ما وراء'), document.fonts.load(`400 54px FreeSerif`, 'ما')]).catch(() => {}),
  new Promise(r => setTimeout(r, 3500))]).then(() => {
  courtSnap(); ready = true; document.getElementById('loading').remove(); window.__ready = true;
  if (q.has('t')) T = +q.get('t');
  if (!q.has('capture')) setPlaying(true);
});
requestAnimationFrame(tick);
</script>
